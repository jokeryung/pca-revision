「然後將利器置於「利器收集箱」（Sharp Box）內」。","wrong":{"A":"係放膠器具。","B":"係放點算好嘅不銹鋼儀器。","D":"教材冇呢個講法；教材嘅答案係「利器收集箱」。"}}},{"id":"Q259","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"開水瓶嘅換水安排係？","options":["早晚兩次，先倒掉瓶內水才注入新鮮水","每更一次，直接加水補足瓶內水量","每日一次，先倒掉瓶內水才注入新鮮水","早晚兩次，直接加水補足瓶內水量"],"answer":"A","explanation":{"correct":"教材：「早晚兩次更換沸水、室溫開水瓶；請先倒掉瓶內的水才注入新鮮水」。","wrong":{"B":"次數及做法都錯。","C":"次數及做法都錯。","D":"要先倒掉。"}}},{"id":"Q260","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"整理用完嘅儀器，第一步應該係？","options":["先將不銹鋼儀器點算","先除去所有利器","先用清水沖洗","先放入 C.S.S.D. 大桶"],"answer":"B","explanation":{"correct":"教材：「每次整理用完之儀器必須先除去所有利器」。","wrong":{"A":"點算喺後面步驟。","C":"教材次序唔係咁。","D":"除去利器之前唔應放入。"}}},{"id":"Q261","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"滴入管（Feeding Set）每次用完之後應該？","options":["用清水洗淨晾乾，掛在病床上備用","放入 C.S.S.D. 大桶","用漂白水浸泡過夜","丟棄並換新"],"answer":"A","explanation":{"correct":"教材：「每次用完要用清水洗淨晾乾，並掛在病床上備用」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「用清水洗淨晾乾，掛在病床上備用」。","C":"教材冇呢個講法；教材嘅答案係「用清水洗淨晾乾，掛在病床上備用」。","D":"丟棄嘅係餵食袋。"}}},{"id":"Q262","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"發現穿刺針有彎曲，應該？","options":["向主管護士報告並送往修理","放入利器收集箱棄置並記錄","用消毒劑浸泡後再繼續使用","自行扳直後繼續使用及記錄"],"answer":"A","explanation":{"correct":"教材：「若發現針有彎曲，要向主管護士報告並送往修理」。","wrong":{"B":"教材話送修理。","C":"教材冇呢個講法；教材嘅答案係「向主管護士報告並送往修理」。","D":"教材冇呢個講法；教材嘅答案係「向主管護士報告並送往修理」。"}}},{"id":"Q263","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"儀器染有血液或黏液，送中央消毒房前應？","options":["用消毒劑先浸泡過夜","直接包好唔好沖洗","用清水先洗去血漬","用酒精燒灼表面"],"answer":"C","explanation":{"correct":"教材：「需要清水先洗去血漬，才送往中央消毒房進行高溫無菌消毒」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「用清水先洗去血漬」。","B":"同教材相反。","D":"教材冇呢個講法；教材嘅答案係「用清水先洗去血漬」。"}}},{"id":"Q264","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"新收病人應點樣供應室溫開水瓶？","options":["除「不准飲食」外都供應","待醫生處方後先供應","待病人要求後先供應","不論飲食指示都供應"],"answer":"A","explanation":{"correct":"教材：「除「不准飲食」外，新收病人請供應室溫開水瓶」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「除「不准飲食」外都供應」。","C":"教材冇呢個講法；教材嘅答案係「除「不准飲食」外都供應」。","D":"不准飲食嘅病人唔供應。"}}},{"id":"Q265","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"急救程序完畢後，急救車應該點處理？","options":["在護士指導下執拾及補充，護士檢查後鎖好","留待下一更護士補充，期間維持不上鎖","由支援人員自行補充，完成後不用上鎖交更","交由中央消毒房整架運走，補充後送返"],"answer":"A","explanation":{"correct":"教材：「在護士指導下執拾整理急救車，及補充所有用品」「護士檢查妥當後會鎖好急救車」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「在護士指導下執拾及補充，護士檢查後鎖好」。","C":"要在護士指導下及上鎖。","D":"教材冇呢個講法；教材嘅答案係「在護士指導下執拾及補充，護士檢查後鎖好」。"}}},{"id":"Q266","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"清潔用棉花塊盒入面應該放？","options":["濕棉花塊，預先加水","乾棉花塊及漂白水","乾棉花塊，用時才加水","濕棉花塊，加入消毒劑"],"answer":"C","explanation":{"correct":"教材：「只放置乾棉花塊」「用時才加適量棉花塊和水」。","wrong":{"A":"同教材相反。","B":"教材冇呢個講法；教材嘅答案係「乾棉花塊，用時才加水」。","D":"同教材相反。"}}},{"id":"Q267","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"發現 C.S.S.D. 物品過期，正確做法係？","options":["加標記「過期」後拆除包裝，直接棄置於醫療廢物","拆除包裝再加標記「過期」，即日送往中央消毒房","加標記「過期」，無需拆包裝，次天送中央消毒房","暫時唔加標記，留待星期六／日一併送去中央消毒房"],"answer":"C","explanation":{"correct":"教材：「若發現過期請加標記「過期」；但無需拆除包裝，次天送往中央消毒房」。","wrong":{"A":"教材冇話棄置。","B":"無需拆包裝，亦係次天送。","D":"要加標記及次天送。"}}},{"id":"Q268","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"標本瓶屬於邊類貯藏品？","options":["清毒物品","食具用品","文具及文儀用品","各類醫療用品"],"answer":"D","explanation":{"correct":"教材：「各類醫療用品」包括「標本瓶、醫療儀器、個人防護裝備、藥物」。","wrong":{"A":"清毒物品係消毒劑、注射器等。","B":"教材冇呢個講法；教材嘅答案係「各類醫療用品」。","C":"教材冇呢個講法；教材嘅答案係「各類醫療用品」。"}}},{"id":"Q269","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"清倒小便袋嘅要求係？","options":["每更至少一次，交更時向護士口頭報告","每更至少一次，清倒後填進出量紀錄表","每日一次，毋須記錄，交更時口頭報告","滿袋才清倒，毋須記錄，交更時口頭報告"],"answer":"B","explanation":{"correct":"教材：「清倒小便袋：每更至少一次」「清倒後請填好進出量紀錄表」。","wrong":{"A":"要填紀錄表。","C":"次數及記錄都錯。","D":"次數及記錄都錯。"}}},{"id":"Q270","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"鼻胃管抽吸托盆幾時更換？","options":["每次用完","每早","每星期","每晚"],"answer":"D","explanation":{"correct":"教材：「鼻胃管抽吸托盆：每晚更換新的托盆及護理物品」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「每晚」。","B":"每早更換係枱布。","C":"教材冇呢個講法；教材嘅答案係「每晚」。"}}},{"id":"Q271","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"注射器屬於邊類貯藏品？","options":["各類醫療用品","清毒物品","文具及文儀用品","食具用品"],"answer":"B","explanation":{"correct":"教材清毒物品：「消毒劑、消毒藥水、注射器、消毒敷料、消毒包、消毒用品」。","wrong":{"A":"教材列喺清毒物品。","C":"教材冇呢個講法；教材嘅答案係「清毒物品」。","D":"教材冇呢個講法；教材嘅答案係「清毒物品」。"}}},{"id":"Q272","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"用完嘅針，以下邊項做法正確？","options":["重新上蓋後才棄置","勿重新上蓋或令其彎曲折斷","彎曲後才棄置，減少佔位","折斷後才棄置，以防再用"],"answer":"B","explanation":{"correct":"教材：「針或利器使用後勿重新上蓋／令其彎曲或折斷」。","wrong":{"A":"同教材相反。","C":"同教材相反。","D":"同教材相反。"}}},{"id":"Q273","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"利器收集箱幾滿就要更換？","options":["裝滿 3/4 時（不應超過八成）","裝滿 1/2 時（不應超過六成）","裝到滿溢之前","裝滿八成半（不應超過九成）"],"answer":"A","explanation":{"correct":"教材：「若已裝滿 3/4 時（不應超過八成），需更換一個」。","wrong":{"B":"同教材唔符；教材寫嘅係「裝滿 3/4 時（不應超過八成）」。","C":"教材要 3/4 就換。","D":"同教材唔符；教材寫嘅係「裝滿 3/4 時（不應超過八成）」。"}}},{"id":"Q274","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"無菌包發現破損，應該？","options":["送返中央消毒房再處理","用膠紙封好繼續使用","即時棄置於醫療廢物","留待下次檢查先處理"],"answer":"A","explanation":{"correct":"教材：「若有任何破損，要送返中央消毒房再處理」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「送返中央消毒房再處理」。","C":"教材話送返再處理。","D":"教材冇呢個講法；教材嘅答案係「送返中央消毒房再處理」。"}}},{"id":"Q275","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"鼻胃管餵飼托盆，餵食袋（Feeding Bag）幾耐丟棄？","options":["每更一次","每次餵食完","每星期一次","每日/24 小時"],"answer":"D","explanation":{"correct":"教材：「每日/24 小時需丟棄餵食袋」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「每日/24 小時」。","B":"教材冇呢個講法；教材嘅答案係「每日/24 小時」。","C":"教材冇呢個講法；教材嘅答案係「每日/24 小時」。"}}},{"id":"Q276","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"儲物室設「物品的負荷表」嘅目的係？","options":["讓員工掌握物品重量，作出適當保護措施","讓員工記低物品的有效日期及存放位置","讓護士計算每月需要訂購的物品數量","讓病人家屬知道物品收費及存量"],"answer":"A","explanation":{"correct":"教材：「以便員工可以掌握物品的重量而作出適當保護措施」。","wrong":{"B":"有效日期另有檢查。","C":"教材冇呢個講法；教材嘅答案係「讓員工掌握物品重量，作出適當保護措施」。","D":"教材冇呢個講法；教材嘅答案係「讓員工掌握物品重量，作出適當保護措施」。"}}},{"id":"Q277","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"病人出院後，床位清潔以下邊項符合教材？","options":["床邊櫃外面抹淨，吸引器留待下次使用先換","床、床鋪、床邊櫃內外清潔消毒，氧氣錶關閉","床單及床褥更換便可，氧氣錶保持開啟備用","待下一位病人入院之前，才統一清潔消毒"],"answer":"B","explanation":{"correct":"教材：「床、床鋪、床邊櫃內外」「並確保氧氣錶關閉」。","wrong":{"A":"教材要內外及清潔吸引器。","C":"同教材唔符；教材寫嘅係「床、床鋪、床邊櫃內外清潔消毒，氧氣錶關閉」。","D":"教材冇呢個講法；教材嘅答案係「床、床鋪、床邊櫃內外清潔消毒，氧氣錶關閉」。"}}},{"id":"Q278","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"貯藏品需求應根據乜嘢釐定？","options":["個別病房貯藏品目錄","全院統一採購清單","物品的負荷表","上一更的口頭指示"],"answer":"A","explanation":{"correct":"教材：「根據個別病房貯藏品之目錄（Inventory）規限而釐定所需要」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「個別病房貯藏品目錄」。","C":"負荷表係看重量。","D":"教材冇呢個講法；教材嘅答案係「個別病房貯藏品目錄」。"}}},{"id":"Q279","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"儲存 CSSD 消毒物品嘅環境應該係？","options":["濕度約 30-40%，溫度約 20-24°C","濕度約 50-60%，溫度約 20-24°C","濕度約 70-80%，溫度約 15-20°C","濕度約 50-60%，溫度約 25-30°C"],"answer":"B","explanation":{"correct":"教材：「濕度大約 50-60」，「溫度恆常（大約 20-24」。","wrong":{"A":"濕度數字錯。","C":"兩者都錯。","D":"溫度數字錯。"}}},{"id":"Q280","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"不銹鋼儀器放入「已用儀器箱」前要做乜？","options":["先用消毒劑浸泡 30 分鐘","先拆除儀器標貼","先交主管護士簽名","小心點算，數目與保留之標貼相符"],"answer":"D","explanation":{"correct":"教材：「儀器數目與保留之標貼相符才放置於「已用儀器箱」內」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「小心點算，數目與保留之標貼相符」。","B":"教材要對標貼。","C":"教材冇呢個講法；教材嘅答案係「小心點算，數目與保留之標貼相符」。"}}},{"id":"Q281","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"膠器具放入 C.S.S.D. 大桶之前要點處理？","options":["用 70% 酒精抹淨","用 1:99 漂白水浸泡","用清水洗淨殘餘消毒溶劑","用 Cidex 洗擦"],"answer":"C","explanation":{"correct":"教材：「然後用清水洗淨殘餘消毒溶劑，才將膠的器具放置於 C.S.S.D. 大桶內」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「用清水洗淨殘餘消毒溶劑」。","B":"教材冇呢個講法；教材嘅答案係「用清水洗淨殘餘消毒溶劑」。","D":"Cidex 用於內窺鏡等。"}}},{"id":"Q282","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"喉內窺鏡／耳鼻喉診斷器應點清潔？","options":["以稀釋漂白水浸泡手柄及配件","以 Hibitane／Alcohol 清潔手柄及配件","以清水及洗潔精清潔手柄及配件","以 Cidex 消毒液浸泡手柄及配件"],"answer":"B","explanation":{"correct":"教材：「以消毒劑（e.g. Hibitane／Alcohol）分別清潔手柄及配件」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「以 Hibitane／Alcohol 清潔手柄及配件」。","C":"教材要用消毒劑。","D":"教材冇呢個講法；教材嘅答案係「以 Hibitane／Alcohol 清潔手柄及配件」。"}}},{"id":"Q283","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"電子血壓計及血氧機可以用邊種嚟抹淨？","options":["清水濕毛巾或 1:15 Savlon","Hibitane 浸泡或 1:49 稀釋漂白水","70% 酒精棉塊或 1:99 稀釋漂白水抹布","2% Cidex 或 1:4 稀釋漂白水抹布"],"answer":"C","explanation":{"correct":"教材：「用沾有 70% 酒精棉塊／1:99 稀釋漂白水抹布／即棄消毒抹布抹淨」。","wrong":{"A":"教材話勿用過濕毛巾。","B":"教材冇咁講，亦唔可浸水。","D":"Cidex 用於內窺鏡。"}}},{"id":"Q284","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"向其他部門外借物品，教材所列處理方法係？","options":["口頭通知、自行取用、月底歸還及記錄","經註冊護士口頭批准、毋須寫借據及點核","借據、經醫生批准、毋須記錄及點核","借據、經病房主管批准、記錄、定期點核"],"answer":"D","explanation":{"correct":"教材：「借據」「經病房主管批准」「定期點核借出或借入物品」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「借據、經病房主管批准、記錄、定期點核」。","B":"教材冇呢個講法；教材嘅答案係「借據、經病房主管批准、記錄、定期點核」。","C":"係病房主管批准，亦要記錄。"}}},{"id":"Q285","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"電子體溫計清潔後應該點處理？","options":["用 70% 酒精棉塊抹淨，用時才套回即棄膠套","用水沖洗，預先套好即棄膠套","用漂白水浸泡，預先套好即棄膠套","用 Cidex 洗擦，用時才套回即棄膠套"],"answer":"A","explanation":{"correct":"教材：「用沾有 70% 酒精棉塊抹淨，用時才套回「即棄膠套」待用」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「用 70% 酒精棉塊抹淨，用時才套回即棄膠套」。","C":"教材冇呢個講法；教材嘅答案係「用 70% 酒精棉塊抹淨，用時才套回即棄膠套」。","D":"Cidex 用於內窺鏡。"}}},{"id":"Q286","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"內窺鏡或不能靠加熱消毒嘅儀器，應該用乜？","options":["Hibitane 清洗","70% 酒精抹淨","Cidex 洗擦","1:99 漂白水浸泡"],"answer":"C","explanation":{"correct":"教材：「內窺鏡或不能靠加熱方法消毒的儀器：用 Cidex 洗擦」。","wrong":{"A":"用於喉內窺鏡手柄及配件等。","B":"用於電子體溫計等。","D":"教材冇呢個講法；教材嘅答案係「Cidex 洗擦」。"}}},{"id":"Q287","chapter":"第三章 環境衞生及安全｜醫療儀器","page":"印刷 p83（PDF p50）","question":"點核儀器時發現不足之數，應該？","options":["記低留待月底報告","下次盤點再核對","自行向其他病房借用","立刻報告"],"answer":"D","explanation":{"correct":"教材：「不足之數應立刻報告」。","wrong":{"A":"教材要立刻。","B":"教材要立刻。","C":"借物要經主管批准。"}}},{"id":"Q288","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"沙威龍 Savlon 嘅成分同稀釋比例係？","options":["Chlorhexidine 3% + Cetrimide 3%，1 比 99","Chlorhexidine 3% + Cetrimide 0.3%，1 比 15","Chlorhexidine 0.3% + Cetrimide 3%，1 比 49","Chlorhexidine 0.3% + Cetrimide 3%，1 比 15"],"answer":"D","explanation":{"correct":"教材：「沙威龍 Savlon（Chlorhexidine 0.3% + Cetrimide 3」，稀釋比例 1 比 15。","wrong":{"A":"成分及比例都錯。","B":"成分濃度倒轉。","C":"稀釋比例錯。"}}},{"id":"Q289","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p89（PDF p52）","question":"物品應該點樣消毒？","options":["先清潔後消毒","消毒後毋須過清水","清潔消毒同時進行","先消毒後清潔"],"answer":"A","explanation":{"correct":"教材：「物品要先清潔後消毒」。","wrong":{"B":"教材話消毒後要過清水。","C":"教材話先後有序。","D":"次序倒轉。"}}},{"id":"Q290","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p89（PDF p52）","question":"消毒劑用後應儲存於？","options":["高溫、乾燥、通風良好的地方","陰涼、乾燥、通風良好的地方","有陽光、乾燥、通風良好的地方","潮濕、密封、陰涼的地方"],"answer":"B","explanation":{"correct":"教材：「用後要妥善儲存於陰涼、乾燥、通風良好的地方」。","wrong":{"A":"要陰涼。","C":"要陰涼。","D":"要乾燥通風。"}}},{"id":"Q291","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"家用漂白水含幾多次氯酸鈉？","options":["0.05%","5.25%","10%","1%"],"answer":"B","explanation":{"correct":"教材：「家用漂白水，含 5.25% 次氯酸鈉溶液」。","wrong":{"A":"係 1:99 稀釋後濃度。","C":"教材冇呢個講法；教材嘅答案係「5.25%」。","D":"係 1:4 稀釋後濃度。"}}},{"id":"Q292","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"Sodium Hypochlorite 嘅特性，以下邊項正確？","options":["腐蝕金屬，與酸性溶液接觸產生有毒氣體","易燃，消毒作用快但很容易揮發","鹼性溶液，需要活化後才可使用","性質溫和，有清潔作用，可用作清洗傷口"],"answer":"A","explanation":{"correct":"教材：「腐蝕金屬」「與酸性溶液接觸會產生有毒氣體」。","wrong":{"B":"屬火酒。","C":"屬 Cidex。","D":"屬 Hibitane。"}}},{"id":"Q293","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"火酒滲透有機物質嘅能力，教材點講？","options":["能力弱","冇滲透能力","因濃度而異","能力強"],"answer":"A","explanation":{"correct":"教材：「滲透有機物質的能力弱」。","wrong":{"B":"教材話弱，唔係冇。","C":"教材冇呢個講法；教材嘅答案係「能力弱」。","D":"同教材相反。"}}},{"id":"Q294","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p89（PDF p52）","question":"點解有機物會降低消毒劑功效？","options":["令細菌繁殖變慢，消毒劑難以作用","形成保護層，妨礙消毒劑與細菌接觸","令消毒劑濃度升高，傷害物品","令消毒劑揮發更快"],"answer":"B","explanation":{"correct":"教材：「有機物在微生物及細菌的表面形成保護層妨礙消毒劑與微生物及細菌的接觸」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「形成保護層，妨礙消毒劑與細菌接觸」。","C":"教材話係令濃度降低。","D":"教材冇呢個講法；教材嘅答案係「形成保護層，妨礙消毒劑與細菌接觸」。"}}},{"id":"Q295","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"教材話現時醫院最主要使用嘅消毒劑係？","options":["漂白水","Hibitane","Cidex","Savlon"],"answer":"B","explanation":{"correct":"教材：「Hibitane 為現時醫院最主要使用之消毒劑」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「Hibitane」。","C":"主要用於消毒內窺鏡。","D":"教材冇呢個講法；教材嘅答案係「Hibitane」。"}}},{"id":"Q296","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"Cidex 屬於邊類消毒劑，濃度幾多？","options":["次氯酸鈉類，5.25%","醛類，70%","酒精類，2%","醛類，2%"],"answer":"D","explanation":{"correct":"教材：「醛類 Aldehyde（例如：Cidex」，濃度 2%。","wrong":{"A":"5.25% 係家用漂白水。","B":"70% 係火酒。","C":"教材話係醛類。"}}},{"id":"Q297","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"火酒（Alcohol）嘅常用濃度同特性係？","options":["70%，需要活化","2%，需要活化","70%，易燃及易揮發","2%，易燃及易揮發"],"answer":"C","explanation":{"correct":"教材：火酒「70」，「消毒作用快但易揮發」，易燃。","wrong":{"A":"活化係 Cidex。","B":"呢組屬 Cidex。","D":"2% 係 Cidex 濃度。"}}},{"id":"Q298","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"以下邊個稀釋比例同濃度配搭正確？","options":["1:49 － 0.1%（1,000 ppm）","1:49 － 1%（10,000 ppm）","1:99 － 1%（10,000 ppm）","1:4 － 0.1%（1,000 ppm）"],"answer":"A","explanation":{"correct":"教材：「0.1%（1,000 ppm）1 比 49」。","wrong":{"B":"1% 配 1:4。","C":"1:99 配 0.05%。","D":"1:4 配 1%。"}}},{"id":"Q299","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"以下邊項最適合用嚟清洗傷口？","options":["漂白水","Hibitane","Cidex","火酒"],"answer":"B","explanation":{"correct":"教材：Digluconate「用作皮膚及黏膜的消毒及清洗傷口」。","wrong":{"A":"避免接觸皮膚或黏膜。","C":"用作儀器消毒，刺激皮膚。","D":"用作皮膚、金屬表面或儀器消毒，冇列清洗傷口。"}}},{"id":"Q300","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"Cidex 點解唔可以喺病房內使用？","options":["由於腐蝕金屬","由於遇酸產生有毒氣體","由於易燃易爆","由於含致癌物質"],"answer":"D","explanation":{"correct":"教材：「由於含致癌物質，不可於病房內使用」。","wrong":{"A":"腐蝕金屬係漂白水嘅特性。","B":"與酸性溶液產生有毒氣體係漂白水嘅特性。","C":"易燃係火酒嘅特性。"}}},{"id":"Q301","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"Hibitane 又叫乜名，濃度範圍係？","options":["Cetrimide，0.05% – 4%","Aldehyde，濃度為 2%","Chlorhexidine，0.05% – 4%","Chlorhexidine，稀釋 1 比 15"],"answer":"C","explanation":{"correct":"教材：「希必定（Hibitane，又名 Chlorhexidine」，濃度「0.05% – 4」。","wrong":{"A":"Cetrimide 係 Savlon 成分。","B":"Aldehyde 係 Cidex 類。","D":"1:15 係 Savlon 稀釋比例。"}}},{"id":"Q302","chapter":"第三章 環境衞生及安全｜消毒劑","page":"印刷 p88（PDF p51）","question":"Cidex 活化後嘅有效期限係？","options":["24 小時內","7 至 14 日","28 至 56 日","14 至 28 日"],"answer":"D","explanation":{"correct":"教材：「需要活化，有效期限為 14 至 28 日」。","wrong":{"A":"24 小時係稀釋漂白水。","B":"同教材唔符；教材寫嘅係「14 至 28 日」。","C":"同教材唔符；教材寫嘅係「14 至 28 日」。"}}},{"id":"Q303","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p91（PDF p54）","question":"經稀釋嘅漂白水，最好幾耐內用完？","options":["48 小時","24 小時","7 日","12 小時"],"answer":"B","explanation":{"correct":"教材：「經稀釋的漂白水最好在 24 小時內用完」。","wrong":{"A":"同教材唔符；教材寫嘅係「24 小時」。","C":"同教材唔符；教材寫嘅係「24 小時」。","D":"同教材唔符；教材寫嘅係「24 小時」。"}}},{"id":"Q304","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"一般環境清潔應用邊個濃度？","options":["500 ppm（1 比 99）","5,000 ppm（1 比 9）","10,000 ppm（1 比 4）","1,000 ppm（1 比 49）"],"answer":"A","explanation":{"correct":"教材表：1 比 99，500 ppm，「作一般環境清潔」。","wrong":{"B":"教材表冇呢個。","C":"用於血液濺溢。","D":"用於嘔吐物、排泄物或分泌物。"}}},{"id":"Q305","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"完成消毒後，清潔用具應該點處理？","options":["浸於稀釋漂白水 5 分鐘，不用沖洗便可再用","浸於未稀釋漂白水 30 分鐘，再用清水沖洗","浸於稀釋漂白水 30 分鐘，用清水沖洗乾淨","用清水沖洗後即時再用，不用浸泡漂白水"],"answer":"C","explanation":{"correct":"教材：「把清潔用具浸於稀釋漂白水中 30 分鐘，並用清水沖洗乾淨」。","wrong":{"A":"時間同沖洗都錯。","B":"要用稀釋漂白水。","D":"要先浸。"}}},{"id":"Q306","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"消毒被血液濺溢嘅設施，應用邊個稀釋比例？","options":["1 比 49","1 比 4","1 比 15","1 比 99"],"answer":"B","explanation":{"correct":"教材表：1 比 4 用途「消毒被血液濺溢的設施」。","wrong":{"A":"用於嘔吐物、排泄物或分泌物。","C":"係 Savlon 稀釋比例。","D":"用於一般環境清潔。"}}},{"id":"Q307","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"調校 1 比 49 漂白水，5 毫升漂白水要加幾多水？","options":["245 毫升","49 毫升","495 毫升","99 毫升"],"answer":"A","explanation":{"correct":"教材：「以 1 毫升漂白水混和於 49 毫升水內」，5×49＝245。","wrong":{"B":"係 1 毫升漂白水嘅水量。","C":"係 1 比 99 計法。","D":"比例錯。"}}},{"id":"Q308","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"以下邊組係調校漂白水嘅個人防護裝備？","options":["口罩、膠手套、膠圍裙、護眼罩","口罩、布手套、布圍裙、眼鏡","手術袍、膠手套、頭套、鞋套","呼吸器、面罩、保護衣、手術袍"],"answer":"A","explanation":{"correct":"教材：「個人防護裝備：口罩、膠手套、膠圍裙、護眼罩」。","wrong":{"B":"教材話係膠手套及膠圍裙。","C":"教材冇呢個講法；教材嘅答案係「口罩、膠手套、膠圍裙、護眼罩」。","D":"接近 Cidex 要求。"}}},{"id":"Q309","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p91（PDF p54）","question":"用漂白水抹過後要靜置幾耐先冲水抹乾？","options":["30-45 分鐘","5-10 分鐘","15-30 分鐘","1 小時"],"answer":"C","explanation":{"correct":"教材：「要靜置 15-30 分鐘，等待漂白水發揮殺菌功效」。","wrong":{"A":"同教材唔符；教材寫嘅係「15-30 分鐘」。","B":"同教材唔符；教材寫嘅係「15-30 分鐘」。","D":"同教材唔符；教材寫嘅係「15-30 分鐘」。"}}},{"id":"Q310","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p90（PDF p53）","question":"病人嘔吐污染咗地面，應用邊個稀釋比例消毒？","options":["1 比 4","1 比 15","1 比 49","1 比 99"],"answer":"C","explanation":{"correct":"教材表：1 比 49 用途「消毒被嘔吐物、排泄物或分泌物污染的表面或物件」。","wrong":{"A":"用於血液濺溢。","B":"係 Savlon 稀釋比例。","D":"用於一般環境清潔。"}}},{"id":"Q311","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p91（PDF p54）","question":"用完清潔劑後想用漂白水消毒，應該？","options":["先用水過清後，才再用漂白水","用清潔劑抹後不過水即加漂白水","同清潔劑一併混和後才使用","先加漂白水消毒再用清潔劑清潔"],"answer":"A","explanation":{"correct":"教材：「應先用清潔劑清潔及用水過清後，才再用漂白水消毒」。","wrong":{"B":"要先過清水。","C":"教材話不要混和。","D":"次序錯。"}}},{"id":"Q312","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p91（PDF p54）","question":"漂白水同潔廁劑混用會點？","options":["提高殺菌功能且無其他影響","提高殺菌功能及產生有毒氣體","降低殺菌功能及產生有毒氣體","降低殺菌功能但無其他影響"],"answer":"C","explanation":{"correct":"教材：「會降低殺菌功能及產生有毒氣體」。","wrong":{"A":"同教材相反。","B":"殺菌功能係降低。","D":"教材話仲會產生有毒氣體。"}}},{"id":"Q313","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p91（PDF p54）","question":"漂白水濺入眼睛，要點處理？","options":["以清水沖洗至少 15 分鐘及看醫生","以 70% 酒精棉抹淨，然後看醫生","以清水沖洗至少 5 分鐘，不適才看醫生","以生理鹽水沖洗 1 分鐘，然後休息"],"answer":"A","explanation":{"correct":"教材：「須以清水沖洗至少 15 分鐘及看醫生」。","wrong":{"B":"同教材唔符；教材寫嘅係「以清水沖洗至少 15 分鐘及看醫生」。","C":"時間不足，亦要看醫生。","D":"同教材唔符；教材寫嘅係「以清水沖洗至少 15 分鐘及看醫生」。"}}},{"id":"Q314","chapter":"第三章 環境衞生及安全｜漂白水","page":"印刷 p89（PDF p52）","question":"漂白水遇邊啲情況會分解？","options":["空氣和清水","塵埃和濕氣","凍水和陰涼","熱和光"],"answer":"D","explanation":{"correct":"教材：「遇熱和光會分解」。","wrong":{"A":"教材話漂白水可與水混合。","B":"教材冇呢個講法；教材嘅答案係「熱和光」。","C":"教材話稀釋要用凍水、放陰涼地方，唔係令佢分解嘅原因。"}}},{"id":"Q315","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p94（PDF p55）","question":"沐浴完關水嘅正確次序係？","options":["凍水熱水同時關","先關熱水，然後關凍水","按病人喜好決定次序","先關凍水，然後關熱水"],"answer":"B","explanation":{"correct":"教材：「沐浴完，應先關熱水，然後關凍水」。","wrong":{"A":"教材話有先後。","C":"教材話有先後。","D":"次序倒轉。"}}},{"id":"Q316","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p94（PDF p55）","question":"沐浴時調校水溫嘅正確次序係？","options":["先開凍水，然後開熱水","按病人喜好決定次序","凍水熱水同時開","先開熱水，然後開凍水"],"answer":"A","explanation":{"correct":"教材：「調校水溫應先開凍水，然後開熱水」。","wrong":{"B":"次序錯。","C":"教材話有先後。","D":"次序倒轉。"}}},{"id":"Q317","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p95（PDF p56）","question":"消防喉轆嘅正確次序係？","options":["火警鐘→來水制→喉嘴箱玻璃→膠喉管→喉嘴掣","火警鐘→膠喉管→來水制→喉嘴箱玻璃→喉嘴掣","火警鐘→來水制→膠喉管→喉嘴箱玻璃→喉嘴掣","來水制→火警鐘→喉嘴箱玻璃→膠喉管→喉嘴掣"],"answer":"A","explanation":{"correct":"教材：「開啟來水制」「打破喉嘴箱玻璃」「拉出膠喉管」「開啟喉嘴掣」依次序，第一步係火警鐘。","wrong":{"B":"來水制應喺膠喉管之前。","C":"喉嘴箱玻璃應喺膠喉管之前。","D":"第一步應係火警鐘。"}}},{"id":"Q318","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p94（PDF p55）","question":"同樣用輔助步行器，教材將邊個情況列為高危活動？","options":["非繁忙時段由同事陪同","治療師指導下練習","護士扶持下使用","繁忙時段單獨使用"],"answer":"D","explanation":{"correct":"教材：「繁忙的時段單獨使用輔助步行器在病室內外行走」。","wrong":{"A":"教材高危清單冇呢項。","B":"教材高危清單冇呢項。","C":"教材高危清單冇呢項。"}}},{"id":"Q319","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p95（PDF p56）","question":"正確使用消防喉轆第一步係？","options":["開啟喉嘴掣","按動火警鐘掣","開啟來水制","拉出膠喉管"],"answer":"B","explanation":{"correct":"教材：「打爛火警鐘掣玻璃或按動火警鐘掣」係第 1 步。","wrong":{"A":"第 5 步。","C":"第 2 步。","D":"第 4 步。"}}},{"id":"Q320","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p95（PDF p56）","question":"員工應認識工作地點嘅邊啲防火設施？","options":["消防喉、利器收集箱、火警鐘、逃生路線","火警鐘、氧氣錶、消防喉、儲物架","火警鐘、消防喉、滅火筒、逃生路線","急救車、血壓計、滅火筒、逃生路線"],"answer":"C","explanation":{"correct":"教材：「火警鐘；消防喉；滅火筒；逃生路線」。","wrong":{"A":"利器收集箱唔喺清單。","B":"氧氣錶、儲物架唔喺清單。","D":"急救車、血壓計唔喺清單。"}}},{"id":"Q321","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p95（PDF p56）","question":"「出路」門戶應該保持咩狀態？","options":["保持打開，下班上鎖","保持打開，切勿上鎖","保持關閉，下班上鎖","保持關閉，切勿上鎖"],"answer":"D","explanation":{"correct":"教材：「所有「出路」門戶必須保持關閉，切勿上鎖」。","wrong":{"A":"兩者都錯。","B":"應保持關閉。","C":"切勿上鎖。"}}},{"id":"Q322","chapter":"第三章 環境衞生及安全｜病房安全及防火","page":"印刷 p94（PDF p55）","question":"病人高估自己活動能力，不聽勸告自行下床，教材視之為？","options":["病人行使選擇權嘅表現","鼓勵獨立處理日常活動","容易引致意外的高危活動","康復良好嘅指標"],"answer":"C","explanation":{"correct":"教材：「高估自己活動能力，不聽從醫護人員勸告」。","wrong":{"A":"教材冇咁連繫。","B":"教材話係高危活動。","D":"教材冇呢個講法；教材嘅答案係「容易引致意外的高危活動」。"}}}];

腸、迴腸","p35"],["大腸","盲腸、升結腸、橫結腸、降結腸、乙狀結腸、直腸","p35"],["泌尿系統","腎臟、輸尿管（20–30 公分）、膀胱及尿道","p36"],["皮膚功用","保護、調節體溫、感覺、分泌及排泄、形成維生素 D、免疫、色素形成","p37"]]},{"id":"2B","ch":"第二章 人體結構及病理","title":"高血壓","pages":"p38–41, p44","tag":"★ 手寫：病－重要考","points":["收縮壓＝上壓（Systolic）；舒張壓＝下壓（Diastolic）；血管阻力越大血壓越高（p38）","定義：休息狀態下收縮壓持續 ≥140mmHg、舒張壓持續 ≥90mmHg（p38）","原發性 90%，原因不明；繼發性 10%，由腎病等引起，基本疾病治癒後血壓恢復正常（p39）","BMI＝體重（公斤）÷身高（米）²；≥25 肥胖、23–24.9 過重、18.5–22.9 適中、<18.5 過輕（p39–40）","中央肥胖：女 80cm、男 90cm 或以上（p40）","大部份無異常症狀，故稱「無形殺手」（p41）","併發症影響腦、心臟、腎、眼（p41）","不可自行增減藥量或停藥（p41）","⚠️ 藥物副作用及之後內容喺 p42–43，掃描檔冇"],"terms":[["吸煙點令血壓升","尼古丁使血管收縮，心跳加快","p40"],["酒精點令血壓升","刺激中樞神經產生興奮，心跳加速","p40"],["太鹹點令血壓升","水份儲留，血管壁水腫增厚，內腔收窄","p40"],["膽固醇及脂肪","脂肪積聚血管內，增加血管阻力","p40"],["利尿劑","通過排尿，減低體內積水，從而降低血壓","p41"],["血管擴張藥","令體內血管舒張，令血壓下降","p41"]]},{"id":"2C","ch":"第二章 人體結構及病理","title":"中風","pages":"p45–48","tag":"★ 併發症手寫「記晒」","points":["血管閉塞或爆裂，腦細胞得不到營養及氧氣而死去（p45）","缺血性：短暫性腦缺血發作、腦血栓形成、腦栓塞；出血性：腦出血（p46）","徵狀：半身不遂、言語不清、嘴歪、眼斜、流口水、吞嚥困難、大小便失禁、感覺麻木（p46）","併發症 12 項：壓瘡、肺炎、消化道出血、癲癇發作、吞嚥困難、患側肌肉痙攣、抑鬱、昏迷或死亡、便秘、水腫、泌尿道感染、呼吸道感染（p46）","溝通：慢且清楚、勿一次太多指示、智能可能仍正常（p47）","進食：坐起身；每口少些；完全吞嚥後才送第二口；食物置視線範圍內（p47）","主要成因：吸煙、血壓高、血管硬化（p48）"],"terms":[["物理治療（中風）","恢復身體功能，指導護理及運動","p46"],["職業治療（中風）","自我照顧、家居操作、工作及消閒生活獲最高自理能力","p46"],["言語治療（中風）","改善吞嚥、溝通及表達","p46"],["醫務社工（中風）","經濟援助、房屋、家務助理、就職安排、院舍服務","p47"],["擺位","枕頭墊於健側肩及上臂下方；患肢用枕頭扶托","p47"]]},{"id":"2D","ch":"第二章 人體結構及病理","title":"冠心病","pages":"p49–52","tag":"★ 手寫重點","points":["佔心臟病死亡人數六成；60% 未及送院已死亡（p49）","兩大類：心絞痛、心肌梗塞（p49）","心絞痛：通常幾分鐘內痛楚消失；超過 20 分鐘可能完全堵塞（p49）","心絞痛處理：終止活動，坐下或半坐臥，通知醫護，留意生命表徵，安慰（p50）","心肌梗塞：持續多於半小時，休息不能舒緩；常發於早晨；血壓下降、脈搏速而弱（p50）","少數糖尿病、高齡患者可能冇胸痛（p50）","心跳停止：協助護士立刻進行心外壓（p50）","危險因素：年齡、高膽固醇、吸煙、高血壓、肥胖、糖尿病、壓力、缺乏運動、酗酒（p51）"],"terms":[["通波仔","冠狀動脈再成形術（P.T.C.A.）","p51"],["搭橋手術","冠狀動脈繞道術：取一段血管作橋","p51"],["冠狀動脈擴大術","超聲波透視下將導管插進狹窄處擴大","p51"],["舌底丸（T.N.G.）","如遇心絞痛情況，應立刻含服","p52"],["冠心病藥物","降低血壓及心跳，減少心肌耗氧量","p51"]]},{"id":"2E","ch":"第二章 人體結構及病理","title":"糖尿病","pages":"p53–57","tag":"★ 足部護理手寫重點","points":["胰臟不能適當分泌胰島素，或接收器功能不佳（p53）","一型：多少於 30 歲、偏瘦、自體免疫；二型：多 40 歲後、肥胖、胰島素抗性（p53）","病徵：皮膚癢、口渴、多尿、疲倦、體重下降、傷口難癒合（p54）","低血糖：濕冷蒼白、飢餓、顫抖，可低於 2.2mmol/L，無尿糖（p54）","高血糖：乾燥、嚴重口渴、水果甜味呼吸，可高於 40mmol/L，有尿糖及酮體（p54）","慢性併發症：視網膜、腎臟、循環、神經、皮膚（p54–55）","只可以控制不能根治（p55）","足部：下午買鞋；平底闊頭；手肘或水溫計試水；腳甲平剪（p56）","預防：均衡營養、適量運動、良好飲食習慣（p57）"],"terms":[["胰島素抗性","胰臟有少量胰島素，但身體組織未能良好反應","p53"],["胰島素類別","短效 8 小時、中效 24 小時、長效 36 小時","p55"],["口服降血糖藥作用","刺激分泌胰島素、抑制腸胃吸收糖份、促進組織利用糖份","p55"],["運動的好處","促進新陳代謝，減少對胰島素的需要量","p57"]]},{"id":"2F","ch":"第二章 人體結構及病理","title":"肺結核","pages":"p58–62","tag":"★ 手寫重點","points":["結核桿菌，空氣傳播；亦可影響腦部、淋巴、脊骨、腎臟、關節（p58）","大部份受感染者不會發病（p58）","徵狀：持續咳嗽、午後潮熱、消瘦、咳血、盜汗（p59）","診斷：X-光、痰細菌塗片和培養、支氣管窺鏡等（p59）","藥物三種或四種一起用；治療通常六個月，有些至九個月甚至一年；兩週後傳染性微乎其微；95%以上可康復（p60）","不依從服藥：抗藥性、變壞或復發、傳染親友、死亡（p60）"],"terms":[["全監督治療","定時到診療所取藥，立即在專科護士面前服用","p62"],["卡介苗（BCG）","為初生嬰兒和小學生接種","p62"],["五所肺科醫院","葛量洪、律敦治、靈實、九龍、黃大仙","p62"],["減弱抵抗力疾病","免疫力缺乏症、愛滋病感染、癌症、糖尿、矽肺、酗酒","p58"]]},{"id":"2G","ch":"第二章 人體結構及病理","title":"慢性阻塞性肺病","pages":"p63","tag":"手寫：小考","points":["無法治癒且病情會不斷惡化；2007 年香港第五大殺手；住院日數佔第三位（p63）","呼吸道阻塞及收窄，導致缺氧、氣喘、咳嗽（p63）","高危：長期吸煙、二手煙、空氣及室內污染、工作環境煙塵及化學物、先天性抗蛋白質酵素不足（p63）","⚠️ p64 起內容冇掃描"],"terms":[["C.O.P.D","Chronic Obstructive Pulmonary Diseases 慢性阻塞性肺病","p63"],["缺氧表現","嘴唇、手、腳呈藍色","p63"]]},{"id":"3A","ch":"第三章 環境衞生及安全","title":"物品存放","pages":"p80–82","tag":"★ 利器收集箱有手寫重點","points":["儲物室：充足照明、清楚指引、負荷表、輔助用具、乾爽清潔（p80）","整理儀器先除利器，放入 Sharp Box（p80）","已用二十次的穿刺針交主管護士更新（p80）","過期：加標記、無需拆包裝、次天送中央消毒房（p80）","CSSD 儲存：濕度 50-60%、溫度 20-24°C（p80）","利器箱裝滿 3/4 更換（不應超過八成）；針勿重新上蓋（p81）","無菌溶劑超過 24 小時棄掉（p81）","接近過期物品放前方（p82）"],"terms":[["Feeding Set","每次用完清水洗淨晾乾，掛在病床上備用","p81"],["Feeding Bag","每日/24 小時丟棄","p81"],["鼻胃管抽吸托盆","每晚更換","p81"],["開水瓶","早晚兩次更換，先倒掉瓶內水","p82"],["小便袋","每更至少一次，清倒後填進出量紀錄表","p82"],["Inventory","個別病房貯藏品目錄，用嚟釐定所需","p82"]]},{"id":"3B","ch":"第三章 環境衞生及安全","title":"醫療儀器","pages":"p83","tag":"手寫重點","points":["不足之數立刻報告；損壞立即報告（p83）","借物：借據、經病房主管批准、記錄、定期點核（p83）"],"terms":[["電子血壓計／血氧機","勿用過濕毛巾；70% 酒精棉塊／1:99 漂白水抹布／即棄消毒抹布","p8 function vQuiz(){const z=S.quiz;
 if(!z){const pool=Q.filter(q=>S.picked.includes(secOf(q)));const done=pool.filter(q=>S.seen.includes(q.id)).length;const chs=[...new Set(C.map(c=>c.ch))];
  app.innerHTML=`<h1>MC 練習</h1><p class="mute sm">揀範圍，每批最多 ${BATCH} 題，題目同選項次序都會隨機。</p>
  <div><button class="btn ghost small" data-act="pick-all">全選</button><button class="btn ghost small" data-act="pick-none">清除</button></div>
  ${chs.map(ch=>`<h3>${esc(ch)}</h3>`+C.filter(c=>c.ch===ch).map(c=>{const n=Q.filter(q=>secOf(q)===c.title).length;return `<button class="chip" data-act="pick" data-sec="${esc(c.title)}" aria-pressed="${S.picked.includes(c.title)}">${esc(c.title)} ${n}</button>`}).join('')).join('')}
  <div class="card" style="position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.12)"><div class="row"><span>已選 ${pool.length} 題</span><span class="mute sm">做過 ${done} 題</span></div><div class="bar"><i style="width:${pool.length?done/pool.length*100:0}%"></i></div>
  <button class="btn" data-act="start" ${pool.length?'':'disabled'} style="margin-bottom:0">開始 ${Math.min(BATCH,pool.length)} 題</button></div>`;return}
 if(z.i>=z.ids.length){const pct=Math.round(z.score/z.ids.length*100);const wrongs=z.results.filter(r=>!r.ok);
  app.innerHTML=`<h1>${z.mode==='wrong'?'錯題重做完成':'呢批做完'}</h1><div class="card" style="text-align:center"><div class="score">${z.score} / ${z.ids.length}</div><p class="mute">${pct}% 正確</p></div>
  ${wrongs.length?`<h2>今批做錯 ${wrongs.length} 題（已記入錯題本）</h2>`+wrongs.map(r=>`<div class="card sm"><strong>${esc(byId[r.id].question)}</strong><br>答案：${esc(byId[r.id].options[L.indexOf(byId[r.id].answer)])}<br><span class="mute">${esc(byId[r.id].page)}</span></div>`).join(''):''}
  ${z.mode==='batch'?'<button class="btn" data-act="more">刷新下一批題目</button>':''}
  <button class="btn ghost" data-act="quit">${z.mode==='batch'?'返回揀範圍':'返回錯題本'}</button>`;return}
 const q=byId[z.ids[z.i]],ai=L.indexOf(q.answer),a=z.ans,fl=S.flags[q.id];
 app.innerHTML=`<div class="row"><span class="mute sm">第 ${z.i+1} / ${z.ids.length} 題${z.mode==='wrong'?'（錯題）':''}</span><button class="flag" data-act="quit">結束</button></div><div class="bar"><i style="width:${z.i/z.ids.length*100}%"></i></div>
 <p class="mute sm" style="margin-bottom:2px">${esc(q.chapter.replace('｜',' ｜ '))}</p><p style="font-weight:600;font-size:1.08rem;margin-top:2px">${esc(q.question)}</p>
 ${z.order.map((oi,pos)=>{const k=L[oi];let cls='';let why='';if(a!==null){if(oi===ai)cls='ok';else if(oi===a)cls='bad';why=oi===ai?'':(q.explanation.wrong[k]||'')}
  return `<button class="opt ${cls}" data-act="ans" data-o="${oi}" ${a!==null?'disabled':''}><span class="l">${L[pos]}</span><span>${esc(q.options[oi])}${why?`<span class="why">✗ ${esc(why)}</span>`:''}</span></button>`}).join('')}
 ${a!==null?`<div class="res ${a===ai?'ok':'bad'}"><strong>${a===ai?'✓ 答啱':'✗ 答錯'}</strong>${esc(q.explanation.correct)}<div class="mute sm" style="margin-top:6px">出處：${esc(q.chapter.replace('｜',' ｜ '))}，${esc(q.page)}</div></div>
 <button class="btn" data-act="next">${z.i+1<z.ids.length?'下一題':'睇結果'}</button>`:''}
 ${flagBlock(q.id,fl)}`}
function flagBlock(id,fl){return `<div><button class="flag ${fl?'on':''}" data-act="flag" data-id="${id}">🚩 ${fl?'已標記（撳嚟改）':'呢題有問題'}</button>${S.flagOpen===id?`<div class="card"><label class="sm" for="fn">有咩問題？（可以留空）</label><textarea id="fn" placeholder="例如：第二個選項都啱">${esc(fl?fl.note:'')}</textarea><button class="btn small" data-act="flag-save" data-id="${id}">儲存標記</button>${fl?`<button class="btn ghost small" data-act="flag-del" data-id="${id}">取消標記</button>`:''}</div>`:''}</div>`}

/* 錯題 */
function vWrong(){const ids=Object.keys(S.wrong).filter(i=>byId[i]);
 app.innerHTML=`<h1>錯題本</h1>${ids.length?`<p class="mute sm">共 ${ids.length} 題。重做答啱就會自動移走。</p><button class="btn" data-act="redo">重做全部錯題</button>`+ids.map(i=>{const q=byId[i];return `<div class="card sm"><strong>${esc(q.question)}</strong><br>答案：${esc(q.options[L.indexOf(q.answer)])}<br><span class="mute">錯咗 ${S.wrong[i]} 次｜${esc(q.page)}</span></div>`}).join('')+`<button class="btn ghost" data-act="clear-wrong">清空錯題本</button>`:'<div class="card">暫時冇錯題。做練習答錯嘅題目會自動記喺呢度。</div>'}`}

/* 標記 */
function flagText(){return Object.keys(S.flags).filter(i=>byId[i]).map(i=>{const q=byId[i],f=S.flags[i];return `${i}｜${q.chapter}｜${q.page}\n題目：${q.question}\n我嘅意見：${f.note||'（冇寫）'}`}).join('\n\n')}
function vFlags(){const ids=Object.keys(S.flags).filter(i=>byId[i]);
 app.innerHTML=`<h1>有問題嘅題目</h1>${ids.length?`<p class="mute sm">匯出清單之後貼返俾 Claude，就可以逐條改。</p><button class="btn" data-act="copy">複製清單</button><button class="btn ghost" data-act="dl">下載文字檔</button><p id="msg" class="sm" role="status"></p>`+ids.map(i=>{const q=byId[i],f=S.flags[i];return `<div class="card sm"><strong>${esc(i)}</strong> ${esc(q.question)}<br><span class="mute">${esc(q.page)}</span>${f.note?`<br>意見：${esc(f.note)}`:''}<br><button class="btn ghost small" data-act="flag-del" data-id="${i}">取消標記</button></div>`}).join(''):'<div class="card">未有標記。練習時撳「呢題有問題」就會出現喺呢度。</div>'}`}

document.addEventListener('change',e=>{if(e.target.id==='fcs'){S.fcSec=e.target.value;S.fc=null;render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render();toTop();return}
 const act=b.dataset.act,z=S.quiz;if(!act)return;
 switch(act){
 case'open':S.sec=b.dataset.id;render();toTop();break;
 case'back':S.sec=null;render();toTop();break;
 case'practice-sec':S.picked=[b.dataset.sec];store.set('picked',S.picked);S.quiz=null;S.tab='quiz';render();toTop();break;
 case'cards-sec':S.fcSec=b.dataset.sec;S.fc=null;S.tab='cards';render();toTop();break;
 case'flip':S.fc.flip=!S.fc.flip;b.classList.toggle('flip');break;
 case'fc-next':S.fc.i++;S.fc.flip=false;render();break;
 case'fc-prev':S.fc.i--;S.fc.flip=false;render();break;
 case'fc-shuffle':S.fc=null;render();break;
 case'pick':{const s=b.dataset.sec;S.picked=S.picked.includes(s)?S.picked.filter(x=>x!==s):[...S.picked,s];store.set('picked',S.picked);render();break}
 case'pick-all':S.picked=C.map(c=>c.title);store.set('picked',S.picked);render();break;
 case'pick-none':S.picked=[];store.set('picked',S.picked);render();break;
 case'start':case'more':nextBatch();break;
 case'ans':{if(z.ans!==null)break;const q=byId[z.ids[z.i]],oi=+b.dataset.o,ok=oi===L.indexOf(q.answer);z.ans=oi;if(ok)z.score++;z.results.push({id:q.id,ok});
  if(z.mode==='batch'&&!S.seen.includes(q.id)){S.seen.push(q.id);store.set('seen',S.seen)}
  if(ok){if(z.mode==='wrong')delete S.wrong[q.id]}else S.wrong[q.id]=(S.wrong[q.id]||0)+1;store.set('wrong',S.wrong);render();break}
 case'next':z.i++;if(z.i<z.ids.length)prep();render();toTop();break;
 case'quit':{const m=z&&z.mode;S.quiz=null;S.tab=m==='wrong'?'wrong':'quiz';render();toTop();break}
 case'redo':startQuiz(shuffle(Object.keys(S.wrong).filter(i=>byId[i])),'wrong');break;
 case'clear-wrong':if(confirm('確定清空錯題本？')){S.wrong={};store.set('wrong',S.wrong);render()}break;
 case'flag':S.flagOpen=S.flagOpen===b.dataset.id?false:b.dataset.id;render();break;
 case'flag-save':S.flags[b.dataset.id]={note:(document.getElementById('fn')||{}).value||'',t:Date.now()};store.set('flags',S.flags);S.flagOpen=false;render();break;
 case'flag-del':delete S.flags[b.dataset.id];store.set('flags',S.flags);S.flagOpen=false;render();break;
 case'copy':{const t=flagText(),m=document.getElementById('msg');try{await navigator.clipboard.writeText(t);m.textContent='已複製。'}catch(err){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let k=false;try{k=document.execCommand('copy')}catch(x){}a.remove();m.textContent=k?'已複製。':'複製唔到，請用「下載文字檔」。'}break}
 case'dl':{const u=URL.createObjectURL(new Blob([flagText()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='PCA有問題題目.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);break}
 }});
render();
</script>
</body>
</html>
