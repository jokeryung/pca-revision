<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PCA 溫習</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#22282b;--mute:#626b70;--line:#dfdcd3;--accent:#0f6b63;--accent-ink:#fff;--soft:#e4f0ee;--ok:#1b7a43;--ok-bg:#e5f4ea;--bad:#b3362b;--bad-bg:#fbe9e6;--warn:#8a5a00;--warn-bg:#fbf0d9}
@media (prefers-color-scheme:dark){:root{--bg:#15191b;--card:#1f2528;--ink:#e9ecec;--mute:#a2acb0;--line:#343c40;--accent:#5cc4b8;--accent-ink:#08201d;--soft:#1f3633;--ok:#6fd398;--ok-bg:#17301f;--bad:#f39186;--bad-bg:#3a1f1b;--warn:#e8bf73;--warn-bg:#352a14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;line-height:1.3;margin:4px 0 12px}
h2{font-size:1.08rem;margin:20px 0 8px}
h3{font-size:.85rem;color:var(--mute);font-weight:600;margin:18px 0 8px}
p{margin:8px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.btn{display:block;width:100%;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;margin:10px 0}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{display:inline-block;width:auto;min-height:40px;padding:6px 12px;margin:4px 6px 4px 0;font-weight:500;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;min-height:52px}
.link small{color:var(--mute);white-space:nowrap}
.mute{color:var(--mute)}.sm{font-size:.86rem}
.tag{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:.8rem;margin:2px 0}
ul{padding-left:20px;margin:8px 0}li{margin:6px 0}
dl{margin:0}dt{font-weight:600;margin-top:10px}dd{margin:0;color:var(--ink)}dd .pg{color:var(--mute);font-size:.8rem;margin-left:6px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:128px;min-height:58px;border:0;background:none;font-size:.82rem;color:var(--mute);position:relative}
nav button b{display:block;font-size:1.25rem;font-weight:400;line-height:1.25}
nav button[aria-current=page]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:.66rem;min-width:17px;padding:0 4px;line-height:17px;font-weight:600}
.chip{display:inline-block;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin:4px 6px 4px 0;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt{display:flex;gap:10px;text-align:left;width:100%;min-height:52px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;align-items:flex-start}
.opt .l{font-weight:700;color:var(--mute);flex:none}
.opt:not(:disabled):active{background:var(--soft)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.why{display:block;font-size:.88rem;margin-top:5px;color:var(--mute)}
.opt.ok .why,.opt.bad .why{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}
.res{padding:12px 14px;border-radius:10px;margin:12px 0}.res.ok{background:var(--ok-bg)}.res.bad{background:var(--bad-bg)}
.res strong{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flag{background:none;border:0;color:var(--mute);font-size:.86rem;min-height:40px;padding:6px 0;text-decoration:underline}
.flag.on{color:var(--warn);font-weight:600}
textarea{width:100%;min-height:76px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fc{perspective:1000px;background:none;border:0;padding:0;width:100%;display:block;margin:12px 0}
.fc-in{display:block;position:relative;height:280px;transition:transform .35s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-radius:14px;border:1px solid var(--line);background:var(--card);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:1.25rem;text-align:center;overflow:auto}
.fc-f.b{transform:rotateY(180deg);background:var(--soft);font-size:1.06rem}
.fc-f small{color:var(--mute);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .btn{margin:0}
select{font:inherit;width:100%;min-height:46px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.score{font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1.2}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="主選單"></nav>
<script>
const Q=[{"id":"Q001","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5（PDF p1）","question":"根據教材，香港共有多少家私營醫院？","options":["十三家","十五家","十一家","十二家"],"answer":"A","explanation":{"correct":"教材列明「香港共有十三家私營醫院」，清單共 13 項。","wrong":{"B":"多過教材清單嘅 13 項。","C":"十一家係教材 p62 胸肺科全日診療所嘅數目，唔係私營醫院。","D":"少咗一家，清單共列 13 項。"}}},{"id":"Q002","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5（PDF p1）","question":"大口環根德公爵夫人兒童醫院喺教材入面屬於邊種醫院？","options":["急症醫院","專科醫院","私營醫院","延續護理醫院"],"answer":"B","explanation":{"correct":"教材寫「專科醫院（如大口環根德公爵夫人兒童醫院」。","wrong":{"A":"教材冇將佢列為急症醫院。","C":"佢唔喺十三家私營醫院清單入面。","D":"延續護理醫院即復康醫院，唔係呢個例子。"}}},{"id":"Q003","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5（PDF p1）","question":"教材入面，香港港安醫院列出咗邊兩個院址？","options":["司徒拔道及荃灣","沙田及跑馬地","荃灣及沙田","司徒拔道及跑馬地"],"answer":"A","explanation":{"correct":"清單分別列「香港港安醫院－司徒拔道」同「香港港安醫院－荃灣」。","wrong":{"B":"兩個地點都唔係教材所列港安院址。","C":"沙田唔係教材所列港安院址。","D":"跑馬地唔係教材所列港安院址。"}}},{"id":"Q004","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5、p62（PDF p1、p45）","question":"以下邊間屬於教材所列嘅私營醫院？","options":["葛量洪醫院","律敦治醫院","明德國際醫院","靈實醫院"],"answer":"C","explanation":{"correct":"「明德國際醫院」喺 p5 私營醫院清單入面。","wrong":{"A":"葛量洪醫院喺 p62 列為肺科醫院，唔喺私營醫院清單。","B":"律敦治醫院喺 p62 列為肺科醫院，唔喺私營醫院清單。","D":"靈實醫院喺 p62 列為肺科醫院，唔喺私營醫院清單。"}}},{"id":"Q005","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5（PDF p1）","question":"香港眼科醫院最適合歸入以下邊一類？","options":["延續護理醫院","專科醫院","急症醫院","精神科醫院"],"answer":"B","explanation":{"correct":"教材專科醫院例子包括「香港眼科醫院」。","wrong":{"A":"延續護理醫院即復康醫院。","C":"教材冇將佢列為急症醫院。","D":"精神科醫院係獨立類別，唔係眼科。"}}},{"id":"Q006","chapter":"第一章 行業簡介｜香港醫院","page":"印刷 p5（PDF p1）","question":"教材將延續護理醫院等同於邊類醫院？","options":["精神科醫院","專科醫院","急症醫院","復康醫院"],"answer":"D","explanation":{"correct":"教材寫「延續護理醫院（即復康醫院」。","wrong":{"A":"精神科醫院係獨立一類。","B":"專科醫院係另一類，例子係兒童及眼科醫院。","C":"急症醫院同延續護理醫院分開列出。"}}},{"id":"Q007","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p9（PDF p3）","question":"施行護理程序後「書寫報告」，教材舉嘅例子係乜？","options":["記錄病人出入量","記錄病人探訪時間","填寫病人收費單據","抄寫病人醫生處方"],"answer":"A","explanation":{"correct":"教材：「施行護理程序後給予記錄有關情況，例如：記錄病人出入量」。","wrong":{"B":"教材冇呢個例子。","C":"教材例子唔係收費單據。","D":"教材例子唔係抄處方。"}}},{"id":"Q008","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"以下邊項屬於「護理病人（Patient Care）」而唔係「病房整潔」？","options":["清理病人之嘔吐物或其他穢物","收集尿液、糞便和痰涎樣本作化驗","確保中央消毒物品沒有過期","病房儀器消毒工作及處理醫療廢物"],"answer":"B","explanation":{"correct":"「收集尿液、糞便和痰涎樣本作化驗」列喺 1) 護理病人。","wrong":{"A":"列喺 2) 病房整潔 b 項。","C":"列喺 2) 病房整潔 f 項。","D":"列喺 2) 病房整潔 a 項。"}}},{"id":"Q009","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"教材舉例嘅生命體徵唔包括以下邊項？","options":["呼吸","血糖","體溫","脈搏"],"answer":"B","explanation":{"correct":"p6 舉例「體溫、血壓、脈搏、呼吸」，冇列血糖。","wrong":{"A":"呼吸係教材列出嘅例子。","C":"體溫係教材列出嘅例子。","D":"脈搏係教材列出嘅例子。"}}},{"id":"Q010","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"C.S.S.D. 物品喺病房整潔職務入面，支援人員要確保乜嘢？","options":["沒有過期","已點算兩次","已重新包裝","放喺床邊櫃"],"answer":"A","explanation":{"correct":"教材：「確保中央消毒物品」「沒有過期」。","wrong":{"B":"教材呢項冇提點算次數。","C":"教材冇要求重新包裝。","D":"教材冇話放床邊櫃。"}}},{"id":"Q011","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p9（PDF p3）","question":"病房有水銀或化療藥物外洩，教材要求支援人員點做？","options":["通知病人家屬離開","盡快協助護士處理","即刻獨自清理外洩物","先寫報告再通知護士"],"answer":"B","explanation":{"correct":"教材：「例如有水銀或化療藥物外洩，要盡快協助護士處理」。","wrong":{"A":"教材冇呢項指示。","C":"教材寫協助護士，唔係獨自清理。","D":"教材冇要求先寫報告。"}}},{"id":"Q012","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"用後嘅醫療用品及儀器，應該幾時先按指導處理？","options":["送返中央消毒房後","病人出院之後","下一更交更之後","護士檢查妥當後"],"answer":"D","explanation":{"correct":"教材：「護士檢查妥當後，按指導處理用後之醫療用品及儀器」。","wrong":{"A":"教材次序唔係咁，要先經護士檢查。","B":"教材冇以出院做條件。","C":"教材冇以交更做條件。"}}},{"id":"Q013","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"「護送病人往其他病房、部門或醫院」喺一般職務入面屬於邊一類？","options":["其他（Others）","意外處理","護理病人（Patient Care）","病房整潔（Ward Routine）"],"answer":"A","explanation":{"correct":"「護送病人往其他病房、部門或醫院」列喺 3) 其他 a 項。","wrong":{"B":"意外處理講水銀或化療藥物外洩，唔係護送。","C":"教材列喺其他，唔喺護理病人。","D":"教材列喺其他，唔喺病房整潔。"}}},{"id":"Q014","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"量度病人生命體徵之後，下一步應該點做？","options":["記錄並報告主理護士","交由病人自行記低","記錄後等下一更處理","直接通知病人家屬"],"answer":"A","explanation":{"correct":"p6 h 項：「負責執行一般例行觀察和病人生命體徵工作」，之後要「記錄並報告主理護士」。","wrong":{"B":"教材冇呢個安排。","C":"教材要求報告主理護士，唔係留待下一更。","D":"教材冇話通知家屬。"}}},{"id":"Q015","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p5（PDF p1）","question":"關於臨床護理及檢查，醫護支援人員嘅角色係點？","options":["向醫生直接匯報後執行","督導登記護士執行","協助護士執行","獨自負責執行"],"answer":"C","explanation":{"correct":"教材：「協助護士執行臨床護理、檢查」。","wrong":{"A":"教材冇呢個程序。","B":"教材冇督導護士呢項職責。","D":"教材寫協助，唔係獨自負責。"}}},{"id":"Q016","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p5（PDF p1）","question":"以下邊項最符合教材對醫護支援人員主要職責嘅描述？","options":["獨立決定病人嘅臨床護理及檢查計劃","自行安排病人嘅治療、檢查及護送","代替護士主理病人嘅個人護理及檢查","協助護士為病人提供個人護理服務"],"answer":"D","explanation":{"correct":"主要職責第一項係「協助護士為病人提供個人護理服務」。","wrong":{"A":"教材係協助護士，冇話由支援人員決定護理計劃。","B":"教材冇呢項；職責係按指示及委派工作。","C":"教材寫《協助護士執行臨床護理、檢查》，係協助而非代替。"}}},{"id":"Q017","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"協助病人穿安全背心及加上床欄，教材講明目的係乜？","options":["減少轉換體位","預防病人壓瘡","保障病人安全","方便護士觀察"],"answer":"C","explanation":{"correct":"教材：「協助病人穿安全背心及加上床欄，以保障病人安全」。","wrong":{"A":"教材冇呢個目的，轉換體位係另一項職務。","B":"預防壓瘡喺 p47 係靠轉換體位，唔係穿背心。","D":"教材冇以方便觀察做目的。"}}},{"id":"Q018","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"替病人預備 X 光屬於邊類工作？","options":["病房整潔職務嘅打掃雜務","文件及標本遞送工作","由護士指派的其他病人服務","定期盤點病房物品工作"],"answer":"C","explanation":{"correct":"教材：「由護士指派的其他病人服務及病房工作，例如：替病人預備 X 光」。","wrong":{"A":"打掃雜務同預備 X 光無關。","B":"文件遞送係送標本、取報告等。","D":"盤點係另一項「其他」職務。"}}},{"id":"Q019","chapter":"第一章 行業簡介｜角色及職責","page":"印刷 p6（PDF p2）","question":"以下邊項屬於「病房整潔（Ward Routine）」？","options":["協助病人處理出入院事項","回應病人按鈴給予適當協助","按需要運送儀器往修理或更換","協助加添及保持病房用品齊全"],"answer":"D","explanation":{"correct":"「協助加添及保持病房用品齊全」列喺 2) 病房整潔 d 項。","wrong":{"A":"列喺 1) 護理病人 m 項。","B":"列喺 1) 護理病人 f 項。","C":"列喺 3) 其他 c 項。"}}},{"id":"Q020","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"病人想徵詢其他醫生意見，教材將呢項歸入邊項權利？","options":["選擇權","醫治權","知情權","申訴權"],"answer":"A","explanation":{"correct":"選擇權包括「徵詢其他醫生意見」。","wrong":{"B":"教材冇放喺醫治權。","C":"教材冇放喺知情權。","D":"申訴係透過渠道投訴，唔係徵詢意見。"}}},{"id":"Q021","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"以病人為本服務對「醫院/部門」嘅重要性，以下邊項正確？","options":["建立良好關係","融洽的工作氣氛","滿足使命","加快工作效率"],"answer":"B","explanation":{"correct":"表內醫院/部門一欄有「融洽的工作氣氛」。","wrong":{"A":"屬於個人一欄。","C":"屬於個人一欄。","D":"屬於個人一欄。"}}},{"id":"Q022","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"醫管局行為守則共有幾多個範圍？","options":["八個","五個","四個","六個"],"answer":"D","explanation":{"correct":"教材：「醫管局的行為守則共有六個範圍」。","wrong":{"A":"比教材多。","B":"比教材少；五個係教材 p62 肺科醫院嘅數目。","C":"比教材少。"}}},{"id":"Q023","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"「接受問責」屬於行為守則邊個範圍？","options":["個人行為守則","機構整體守則","與政府的關係","與社區的關係"],"answer":"C","explanation":{"correct":"與政府的關係內容：「支持政府的健康教育計劃、有效運用資源、接受問責」。","wrong":{"A":"該範圍係尊重、禮遇、團隊精神等。","B":"該範圍係遵守法例、制訂安全指引。","D":"該範圍係與社區合作、參與義務工作或慈善活動。"}}},{"id":"Q024","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"病人約章入面，「得到符合現時認可標準的醫療服務」屬於邊項權利？","options":["選擇權","知情權","醫治權","私隱及申訴權"],"answer":"C","explanation":{"correct":"教材：「醫治權：得到符合現時認可標準的醫療服務」。","wrong":{"A":"選擇權係接受或拒絕治療、參與研究、徵詢其他意見。","B":"知情權係知道服務、收費、病情、藥物等資料。","D":"呢項係私隱、保密同投訴。"}}},{"id":"Q025","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"病人決定唔參與醫學研究計劃，係行使邊項權利？","options":["選擇權","醫治權","知情權","私隱及申訴權"],"answer":"A","explanation":{"correct":"選擇權包括「選擇是否參與醫學研究計劃」。","wrong":{"B":"醫治權係得到認可標準嘅服務。","C":"知情權係獲取資料，唔係作決定。","D":"呢項係私隱、保密同投訴。"}}},{"id":"Q026","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"以下邊項屬於病人嘅「責任」而唔係權利？","options":["向醫護人員交代過敏情況","知道治療計劃的風險及其他療法","徵詢其他醫生意見及參與研究","把病情資料保密及獲得尊重"],"answer":"A","explanation":{"correct":"第二部分病人的責任：「詳細向醫護人員交代目前的健康狀況、過往病歷資料、過敏情況」。","wrong":{"B":"屬第一部分知情權。","C":"屬第一部分選擇權。","D":"屬第一部分私隱及申訴權。"}}},{"id":"Q027","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"病人嘅宗教信仰和文化信念獲得尊重，屬於病人約章邊部分？","options":["第一部分：選擇權","第二部分：病人的責任","第一部分：知情權","第一部分：私隱及申訴權"],"answer":"D","explanation":{"correct":"私隱及申訴權下列明「並在宗教信仰和文化信念方面獲得尊重」。","wrong":{"A":"選擇權係接受或拒絕治療等。","B":"第二部分係病人責任，例如交代健康狀況。","C":"知情權係獲取資料。"}}},{"id":"Q028","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"教材比較醫務同非醫務行業，「服務的要求」喺醫務行業係點？","options":["隨意的/四處採購","有限制/沒有選擇的","不愉快的/生命有關的","不隨意的/緊急性"],"answer":"D","explanation":{"correct":"表內服務的要求：醫務行業係「不隨意的/緊急性」。","wrong":{"A":"係非醫務行業嘅服務要求。","B":"係醫務行業「顧客的選擇」。","C":"係醫務行業「服務的種類」。"}}},{"id":"Q029","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"病人想知處方藥嘅名稱同副作用，係行使邊項權利？","options":["私隱及申訴權","醫治權","選擇權","知情權"],"answer":"D","explanation":{"correct":"知情權包括「知道處方藥物的名稱、功效及可能產的副作用」。","wrong":{"A":"呢項係私隱、保密同投訴。","B":"醫治權係得到認可標準嘅醫療服務。","C":"選擇權係決定接受或拒絕，唔係獲取資料。"}}},{"id":"Q030","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"教材所列嘅服務對象，除病人及家屬朋友外仲包括？","options":["政府部門、社區團體及慈善機構","供應商、承包商、義工及合約員工","醫學研究機構、學者及學生","市民大眾、上司、同事及下屬"],"answer":"D","explanation":{"correct":"服務對象列有「市民大眾」及「上司/同事/下屬」。","wrong":{"A":"呢啲係行為守則範圍，唔喺服務對象。","B":"供應商及承包商係行為守則範圍，唔喺服務對象。","C":"教材冇列呢啲對象。"}}},{"id":"Q031","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"以病人為本服務對「個人」嘅重要性，以下邊項正確？","options":["融洽的工作氣氛","提升自我形象","提升醫院的形象","資源的分配"],"answer":"B","explanation":{"correct":"表內個人一欄有「提升自我形象」。","wrong":{"A":"屬於醫院/部門一欄。","C":"屬於醫院/部門一欄。","D":"屬於醫院/部門一欄。"}}},{"id":"Q032","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"「保障私隱、避免利益衝突」屬於行為守則邊個範圍？","options":["個人行為守則","機構整體守則","與病人的關係","與供應商及承包商的關係"],"answer":"A","explanation":{"correct":"個人行為守則內容包括「保障私隱、避免利益衝突、專業操守」。","wrong":{"B":"該範圍內容係遵守法例、制訂安全指引。","C":"該範圍內容係病人約章、伙伴關係、全人護理。","D":"該範圍內容係公平公開程序、經濟效益、合約精神。"}}},{"id":"Q033","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"病人因急病入院，好多時冇得揀服務，呢點對應醫務行業邊個特點？","options":["服務的要求隨意","顧客的選擇沒有限制","服務的種類愉快","顧客的選擇有限制"],"answer":"D","explanation":{"correct":"表內顧客的選擇：醫務行業「有限制/沒有選擇的」。","wrong":{"A":"隨意係非醫務行業嘅特點。","B":"沒有限制係非醫務行業嘅特點。","C":"醫務行業服務種類係不愉快的。"}}},{"id":"Q034","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"「合約精神」屬於行為守則邊個範圍？","options":["與病人的關係","與供應商及承包商的關係","與政府的關係","與社區的關係"],"answer":"B","explanation":{"correct":"該範圍內容：「公平及公開的程序、經濟效益、合約精神」。","wrong":{"A":"該範圍係病人約章、伙伴關係、全人護理。","C":"該範圍係健康教育計劃、運用資源、問責。","D":"該範圍係社區合作及義務工作。"}}},{"id":"Q035","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p10（PDF p4）","question":"「制訂安全指引」屬於行為守則邊個範圍？","options":["個人行為守則","機構整體守則","與社區的關係","與政府的關係"],"answer":"B","explanation":{"correct":"機構整體守則內容：「遵守法例、制訂安全指引」。","wrong":{"A":"該範圍係個人操守方面。","C":"該範圍係社區合作及義務工作。","D":"該範圍係健康教育、資源及問責。"}}},{"id":"Q036","chapter":"第一章 行業簡介｜行為守則及病人約章","page":"印刷 p9（PDF p3）","question":"同事面對焦慮嘅家屬時先諗「如果我係佢會點」，呢個符合邊項基本原則？","options":["易地而處，感同身受","盡量滿足顧客的實際需要","想別人對自己好，就要主動對人好","建立良好關係"],"answer":"A","explanation":{"correct":"基本原則列有「易地而處，感同身受」。","wrong":{"B":"呢項重點係滿足實際需要，唔係代入對方。","C":"呢項重點係主動待人，唔係代入對方。","D":"呢項係服務對個人嘅重要性，唔係基本原則。"}}},{"id":"Q037","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17、p19（PDF p7、p9）","question":"Bedpan 同 Urinal 嘅分別係？","options":["便盆、腎形盆","腎形盆、尿壺","便盆、尿壺","尿壺、便盆"],"answer":"C","explanation":{"correct":"教材：「Bedpan 便盆」「Urinal 尿壺」。","wrong":{"A":"腎形盆係 Kidney dish。","B":"腎形盆係 Kidney dish。","D":"次序倒轉咗。"}}},{"id":"Q038","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18–19（PDF p8–9）","question":"Save urine 同 Test urine 分別係？","options":["保留大便、驗小便","保留小便、驗小便","驗小便、保留小便","保留小便、尿蛋白"],"answer":"B","explanation":{"correct":"教材：「Save urine 保留小便」「Test urine 驗小便」。","wrong":{"A":"保留大便係 Save stool。","C":"次序倒轉咗。","D":"尿蛋白係 Urine Albumin。"}}},{"id":"Q039","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18–19（PDF p8–9）","question":"Protoscope、Tendon Hammer、Tuning fork 分別係？","options":["直腸窺鏡、肌腱鎚、音义","診症器、肌腱鎚、音义","直腸窺鏡、音义、肌腱鎚","直腸窺鏡、肌腱鎚、紗布"],"answer":"A","explanation":{"correct":"教材：「Protoscope 直腸窺鏡」「Tendon Hammer 肌腱鎚」「Tuning fork 音义」。","wrong":{"B":"診症器係 Diagnostic set。","C":"後兩項倒轉。","D":"紗布係 Gauze。"}}},{"id":"Q040","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"要量血糖時應該拎邊件儀器？","options":["Glucometer","Tendon Hammer","Diagnostic set","Oximeter"],"answer":"A","explanation":{"correct":"教材：「Glucometer 血糖機」。","wrong":{"B":"Tendon Hammer 係肌腱 ","換症車、輪椅"],"answer":"B","explanation":{"correct":"教材：「Stretcher 輪床」「Wheel chair 輪椅」。","wrong":{"A":"大便車係 Commode chair。","C":"次序倒轉咗。","D":"換症車係 Dressing Trolley。"}}},{"id":"Q048","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"職業治療部嘅英文係？","options":["Occupational Therapy Department","Physiotherapy Department","Out Patient Department","Operation Theatre"],"answer":"A","explanation":{"correct":"教材：「職業治療部 Occupational Therapy Department」。","wrong":{"B":"係物理治療部。","C":"係門診部。","D":"係手術室。"}}},{"id":"Q049","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"核對病人資料時，Hospital Number 係指？","options":["病房","入院日期及時間","身份証號碼","醫院號碼"],"answer":"D","explanation":{"correct":"教材：「Hospital Number 醫院號碼」。","wrong":{"A":"病房係 Ward。","B":"入院日期及時間係 Date & Time of Admission。","C":"身份証號碼係 I.D. Card no.。"}}},{"id":"Q050","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"Neurology 同 Neurosurgery 分別係？","options":["腦外科、腦科","精神科、腦科","腦科、腦外科","腦科、精神科"],"answer":"C","explanation":{"correct":"教材：「腦科 Neurology」「腦外科 Neurosurgery」。","wrong":{"A":"次序倒轉咗。","B":"精神科係 Psychiatric。","D":"精神科係 Psychiatric，唔係 Neurosurgery。"}}},{"id":"Q051","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"T.S.S.U. 嘅全名係？","options":["Theatre Support Service Unit","Theatre Sterile Supply Unit","Central Sterile Supply Unit","Treatment Sterile Supply Unit"],"answer":"B","explanation":{"correct":"教材：「手術室消毒物品供應部 Theatre Sterile Supply Unit」。","wrong":{"A":"教材冇呢個名稱。","C":"Central 開頭嘅係 C.S.S.D.，而且尾字係 Department。","D":"Treatment 係治療室用字，教材冇呢個名稱。"}}},{"id":"Q052","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"I.C.T. 喺教材入面係指？","options":["深切治療部","感染控制部","中央護理部","社區老人評估小組"],"answer":"B","explanation":{"correct":"教材：「感染控制部 Infection Control Team」。","wrong":{"A":"深切治療部係 I.C.U.。","C":"中央護理部係 C.N.D.。","D":"社區老人評估小組係 C.G.A.T.。"}}},{"id":"Q053","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"R.N. 同 E.N. 分別係指？","options":["資深護師、登記護士","登記護士、註冊護士"," ffice。","D":"急症室係 Accident & Emergency Department。"}}},{"id":"Q060","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"Pantry 喺病房係指？","options":["病房小廚","布類室","儲存室","治療室"],"answer":"A","explanation":{"correct":"教材：「病房小廚 Pantry」。","wrong":{"B":"布類室係 Linen Room。","C":"儲存室係 Store Room。","D":"治療室係 Treatment Room。"}}},{"id":"Q061","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"Prosthetics & Orthotics 係指？","options":["義肢矯型部","放射診斷","視光學","足病診療"],"answer":"A","explanation":{"correct":"教材：「義肢矯型部 Prosthetics & Orthotics」。","wrong":{"B":"放射診斷係 Diagnostic Radiology。","C":"視光學係 Optometry。","D":"足病診療係 Podiatry。"}}},{"id":"Q062","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"Oximeter 用嚟量度乜嘢？","options":["血氧濃度","最高流速","血壓","血糖"],"answer":"A","explanation":{"correct":"教材：「Oximeter 血氧濃度計」。","wrong":{"B":"最高流速係 Peak Flow Rate。","C":"血壓英文係 Blood Pressure。","D":"血糖機係 Glucometer。"}}},{"id":"Q063","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"I&O Chart 嘅中文係？","options":["入出院紀錄表","生命表徵圖表","靜脈輸入液儲存櫃","進出量紀錄表"],"answer":"D","explanation":{"correct":"教材：「Intake & Output Chart (I&O Chart) 進出量紀錄表」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「進出量紀錄表」。","B":"教材冇呢個講法；教材嘅答案係「進出量紀錄表」。","C":"靜脈輸入液儲存櫃係 I.V. fluid cupboard。"}}},{"id":"Q064","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"Linen Exchange Room 嘅中文係？","options":["洗衣部","布類室","衣服更換房","儲存室"],"answer":"C","explanation":{"correct":"p15 部門清單：「衣服更換房 Linen Exchange Room」。","wrong":{"A":"洗衣部係 Laundry。","B":"布類室（衣服房）係 p16 嘅 Linen Room。","D":"儲存室係 Store Room。"}}},{"id":"Q065","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"H.C.E. 嘅職銜係？","options":["部門運作經理","聯網總監","醫院行政總監","行政總經理"],"answer":"C","explanation":{"correct":"教材：「醫院行政總監 Hospital Chief Executive」。","wrong":{"A":"部門運作經理係 D.O.M.。","B":"聯網總監係 C.C.E.。","D":"行政總經理係 GM(AS)。"}}},{"id":"Q066","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"PCA 3A 嘅全名係？","options":["Personal Care Assistant IIIA","Patient Care Attendant IIIA","Patient Care Assistant IIIA","Patient Care Associate IIIA"],"answer":"C","explanation":{"correct":"教材：「三 A 級病人服務助理 Patient Care Assistant IIIA」。","wrong":{"A":"教材用 Patient。","B":"教材用 Assistant。","D":"教材用 Assistant。"}}},{"id":"Q067","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"Patslide 係用嚟做乜？","options":["協助病人如廁","協助病人過床","協助病人步行","協助病人洗頭"],"answer":"B","explanation":{"correct":"教材：「Patslide 病人過床板」。","wrong":{"A":"如廁用便盆、大便車等。","C":"教材冇咁寫。","D":"洗頭係 Hair washing in bed。"}}},{"id":"Q068","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"W.M. 同 N.O. 分別係？","options":["病房經理、護士長","病房經理、註冊護士","部門運作經理、護士長","護士長、病房經理"],"answer":"A","explanation":{"correct":"教材：「病房經理 Ward Manager」「護士長 Nursing Officer」。","wrong":{"B":"註冊護士係 R.N.。","C":"部門運作經理係 D.O.M.。","D":"次序倒轉咗。"}}},{"id":"Q069","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"A.P.N. 嘅中文職銜係？","options":["顧問護師","副顧問護師","資深護師","登記護士"],"answer":"C","explanation":{"correct":"教材：「資深護師 Advanced Practice Nurse」。","wrong":{"A":"顧問護師係 N.C.。","B":"副顧問護師係 ANC。","D":"登記護士係 E.N.。"}}},{"id":"Q070","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17（PDF p7）","question":"以下邊項屬於專職醫療部門（Allied Health Department）？","options":["足病診療","社康護理服務","感染控制部","中央護理部"],"answer":"A","explanation":{"correct":"F 段列有「足病診療 Podiatry」。","wrong":{"B":"喺 p15 部門清單，唔喺專職醫療清單。","C":"喺 p15 部門清單，唔喺專職醫療清單。","D":"喺 p15 部門清單，唔喺專職醫療清單。"}}},{"id":"Q071","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"Paediatrics & Adolescent Medicine 嘅中文係？","options":["老人科","婦產科","兒科及青少年科","精神科"],"answer":"C","explanation":{"correct":"教材：「兒科及青少年科 Paediatrics & Adolescent Medicine」。","wrong":{"A":"老人科係 Geriatric。","B":"婦產科係 Obstetrics & Gynaecology。","D":"精神科係 Psychiatric。"}}},{"id":"Q072","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"Kidney dish 嘅中文係？","options":["便盆","症碗","換症車","腎形盆／腰盆"],"answer":"D","explanation":{"correct":"教材：「Kidney dish 腎形盆／腰盆」。","wrong":{"A":"便盆係 Bedpan。","B":"症碗（Bowl）喺 p81，唔係 Kidney dish。","C":"換症車係 Dressing Trolley。"}}},{"id":"Q073","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17–19（PDF p7–9）","question":"Shower bath、Tub bath、Bed bath 分別係？","options":["浴缸浴、淋浴、床上浴","床上浴、淋浴、浴缸浴","淋浴、床上浴、浴缸浴","淋浴、浴缸浴、床上浴"],"answer":"D","explanation":{"correct":"教材：「Shower bath 淋浴」「Tub bath 浴缸浴」，及 p17 「Bed bath 床上浴」。","wrong":{"A":"前兩項倒轉。","B":"次序全部錯配。","C":"後兩項倒轉。"}}},{"id":"Q074","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"Dirty Utility Room 喺病房入面係？","options":["治療室","盥洗室","污物處理室","儲存室"],"answer":"C","explanation":{"correct":"教材：「污物處理室 Dirty Utility Room」。","wrong":{"A":"治療室係 Treatment Room。","B":"盥洗室係 Sluice Room。","D":"儲存室係 Store Room。"}}},{"id":"Q075","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"Sluice Room 嘅中文係？","options":["病房小廚","浴室","污物處理室","盥洗室"],"answer":"D","explanation":{"correct":"教材：「盥洗室 Sluice Room」。","wrong":{"A":"病房小廚係 Pantry。","B":"浴室係 Bath Room。","C":"污物處理室係 Dirty Utility Room。"}}},{"id":"Q076","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"送標本去 Laboratory，即係送去？","options":["血庫","化驗室","牛奶預備部","藥房"],"answer":"B","explanation":{"correct":"教材：「化驗室 Laboratory」。","wrong":{"A":"血庫係 Blood Bank。","C":"牛奶預備部係 Milk Kitchen。","D":"藥房係 Pharmacy。"}}},{"id":"Q077","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"教材「病床單位（Bed Unit）」包括以下邊組？","options":["病床、椅、床頭燈、氧氣錶、床欄","病床、床邊櫃、輪椅、床頭燈、床柏","病床、床邊櫃、椅、床頭燈、叫人鈴、床柏","病床、床邊櫃、鹽水架、叫人鈴、便盆"],"answer":"C","explanation":{"correct":"教材：「病床單位 Bed Unit：病床、床邊櫃、椅、床頭燈、叫人鈴、床柏」。","wrong":{"A":"氧氣錶、床欄唔喺列出項目。","B":"輪椅唔喺列出項目。","D":"鹽水架、便盆唔喺列出項目。"}}},{"id":"Q078","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p17–18（PDF p7–8）","question":"床上有 Bed sheet 同 Draw sheet，兩者中文分別係？","options":["枕袋、橫單","大床單、毛氈","橫單、大床單","大床單、橫單"],"answer":"D","explanation":{"correct":"教材：「Bed sheet 大床單」「Draw sheet 橫單」。","wrong":{"A":"枕袋係 Pillow case。","B":"毛氈係 Blanket。","C":"次序倒轉咗。"}}},{"id":"Q079","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p19（PDF p9）","question":"Sputum 係指？","options":["糞便","痰","尿液","唾液"],"answer":"B","explanation":{"correct":"p19：「Sputum 痰」。","wrong":{"A":"大便喺教材用 stool。","C":"尿液喺教材用 urine。","D":"教材冇呢個對應。"}}},{"id":"Q080","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"護士叫你去 C.S.S.D. 拎物品，C.S.S.D. 係邊個部門？","options":["社康護理服務","中央護理部","手術室消毒物品供應部","中央消毒物品供應部"],"answer":"D","explanation":{"correct":"教材：「中央消毒物品供應部 Central Sterile Supply Department」。","wrong":{"A":"係 C.N.S.。","B":"係 C.N.D.。","C":"係 T.S.S.U.。"}}},{"id":"Q081","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"C.G.A.T. 嘅中文名稱係？","options":["老人科病房","中央護理部","社康護理服務","社區老人評估小組"],"answer":"D","explanation":{"correct":"教材：「社區老人評估小組 Community Geriatric Assessment Team」。","wrong":{"A":"老人科係 Geriatric，唔係呢個縮寫。","B":"係 C.N.D.。","C":"係 C.N.S.。"}}},{"id":"Q082","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"Dressing Trolley 同 Emergency Trolley 分別係？","options":["換症車、急救車","換症車、輪床","急救車、換症車","鹽水架、急救車"],"answer":"A","explanation":{"correct":"教材：「Dressing Trolley 換症車」「Emergency Trolley 急救車」。","wrong":{"B":"輪床係 Stretcher。","C":"次序倒轉咗。","D":"鹽水架係 Drip stand。"}}},{"id":"Q083","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p16（PDF p6）","question":"以下邊項「唔喺」教材嘅病人資料核對清單入面？","options":["身份証號碼","緊急聯絡人電話","出生日期","入院日期及時間"],"answer":"B","explanation":{"correct":"清單列姓名、性別、年齡、身份証號碼、病房、醫院號碼、「出生日期」、入院日期及時間，冇緊急聯絡人。","wrong":{"A":"喺清單第 4 項。","C":"喺清單第 7 項。","D":"喺清單第 8 項。"}}},{"id":"Q084","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p18（PDF p8）","question":"護士叫你推 Commode chair 過嚟，你應該拎？","options":["大便車","輪床","輪椅","老人高背椅"],"answer":"A","explanation":{"correct":"教材：「Commode chair 大便車」。","wrong":{"B":"輪床係 Stretcher。","C":"輪椅係 Wheel chair。","D":"老人高背椅係 Geriatric high back chair。"}}},{"id":"Q085","chapter":"第一章 行業簡介｜部門及醫護常用語","page":"印刷 p15（PDF p5）","question":"Enquiry Office 同 Account Office 分別係？","options":["入院登記處、財務部","詢問處、人力資源部","入院登記處、會計部","詢問處、會計部"],"answer":"D","explanation":{"correct":"教材：「會計部 Account Office」「詢問處 Enquiry Office」。","wrong":{"A":"入院登記處係 Admission Office，教材部門清單用會計部。","B":"人力資源部係 H.R.。","C":"入院登記處係 Admission Office。"}}},{"id":"Q086","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"面部表情、眼神、手勢喺教材屬於點樣嘅溝通？","options":["語言","訊息回饋","非語言","溝通功能"],"answer":"C","explanation":{"correct":"教材：「非語言：包括身體語言（如臉部表情、眼神、手勢、身體接觸」。","wrong":{"A":"語言係說話嘅聲音、語氣、聲調。","B":"回饋係訊息傳遞過程嘅一環。","D":"功能係交流訊息、抒發情緒等。"}}},{"id":"Q087","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"以下邊項喺教材屬於「語言」溝通？","options":["符號","文字","手勢","語氣"],"answer":"D","explanation":{"correct":"教材：「語言：包括說話的聲音、語氣、聲調」。","wrong":{"A":"符號列喺非語言。","B":"文字列喺非語言。","C":"手勢列喺非語言身體語言。"}}},{"id":"Q088","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"回饋喺溝通上最主要幫到發訊人乜嘢？","options":["令收訊人毋須再次回應","決定訊息應否用文字表達","明白訊息是否已經有效地傳送","消除心理及生理的背後因素"],"answer":"C","explanation":{"correct":"教材：「它幫助發訊人明白訊息是否已經有效地傳送」。","wrong":{"A":"回饋本身就係收訊人嘅回應。","B":"教材冇呢個講法；教材嘅答案係「明白訊息是否已經有效地傳送」。","D":"教材話要認識呢啲因素，冇話回饋可消除。"}}},{"id":"Q089","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"良好嘅溝通，教材話最終有助乜嘢？","options":["建立良好的人際關係","減少病人的投訴","增加資源的分配","提升醫院的形象"],"answer":"A","explanation":{"correct":"教材：「良好的溝通，有助建立良好的人際關係」。","wrong":{"B":"教材呢段冇咁講。","C":"教材呢段冇咁講。","D":"教材呢段冇咁講；提升形象喺 p9。"}}},{"id":"Q090","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"教材話點樣先可以減少溝通不足造成嘅誤會？","options":["避免抒發情緒，集中交流事實、數據及資料","盡量減少身體語言，改用文字及符號傳達訊息","認識了解心理或生理因素的影響，持正確的態度","由發訊人重複訊息，不用等對方回應及回饋"],"answer":"C","explanation":{"correct":"教材：「若認識了解這些因素的影響，持正確的態度，可減少溝通不足做成的誤會」。","wrong":{"A":"抒發情緒本身係溝通功能。","B":"教材冇咁建議。","D":"同回饋嘅重要性相反。"}}},{"id":"Q091","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"教材所畫訊息傳遞過程嘅次序係？","options":["訊息→發訊人→回饋→收訊人→訊息","收訊人→訊息→發訊人→回饋→收訊人","發訊人→回饋→訊息→收訊人→發訊人","發訊人→訊息→收訊人→回饋→發訊人"],"answer":"D","explanation":{"correct":"p20 流程圖：發訊人、訊息、「收訊人」、回饋再返回發訊人。","wrong":{"A":"起點應係發訊人。","B":"發訊人同收訊人倒轉。","C":"回饋應喺收訊人之後。"}}},{"id":"Q092","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"文字、影音喺訊息傳遞過程入面屬於？","options":["回饋及回應","訊息本身內容","發訊人的意念","溝通媒介/渠道"],"answer":"D","explanation":{"correct":"教材：「溝通媒介/渠道：譬如文字、影音、身體語言等」。","wrong":{"A":"回饋係確認訊息有效傳送。","B":"訊息本身係意念、想法或情感。","C":"發訊人係發出訊息嘅人。"}}},{"id":"Q093","chapter":"第一章 行業簡介｜溝通技巧","page":"印刷 p20（PDF p10）","question":"發訊人要確保收訊人準確接收訊息，教材話要倚賴乜？","options":["溝通媒介","非語言訊息","意念本身","回饋"],"answer":"D","explanation":{"correct":"教材：「發訊人若要確保收訊人準確地接收訊息，便必須倚賴回饋」。","wrong":{"A":"媒介係傳遞渠道，唔係確認方法。","B":"教材冇呢個講法；教材嘅答案係「回饋」。","C":"意念係訊息內容。"}}},{"id":"Q094","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"關節嘅功用係？","options":["支持身體及保護內臟","製造血液及血液細胞","協助運動及吸收輕微震動","貯存鈣和磷質等物質"],"answer":"C","explanation":{"correct":"教材：「關節功用：協助運動及吸收輕微震動」。","wrong":{"A":"係骨骼功用。","B":"係骨骼功用。","D":"係骨骼功用。"}}},{"id":"Q095","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"肺循環由邊個心腔輸出，返到邊個心腔？","options":["左心房輸出，返到右心室","右心房輸出，返到左心室","左心室輸出，返到右心房","右心室輸出，返到左心房"],"answer":"D","explanation":{"correct":"教材：「肺循環是缺氧的血液從右心室輸到肺，後回返至左心房」。","wrong":{"A":"起點終點都錯。","B":"起點終點都錯。","C":"係體循環。"}}},{"id":"Q096","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p36（PDF p21）","question":"輸尿管嘅長度係？","options":["1 公分","40 公分","10–15 公分","20–30 公分"],"answer":"D","explanation":{"correct":"教材：「輸尿管（20–30 公分」。","wrong":{"A":"1 公分係右淋巴管。","B":"40 公分係胸管。","C":"同教材唔符；教材寫嘅係「20–30 公分」。"}}},{"id":"Q097","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p33（PDF p18）","question":"胸廓由乜嘢組成？","options":["肋骨及肱骨","胸骨及肋骨","胸骨及胸椎","鎖骨及肩胛骨"],"answer":"B","explanation":{"correct":"p33 圖標示胸廓由胸骨、肋骨組成。「人體骨骼圖」。","wrong":{"A":"肱骨係上肢骨。","C":"圖中胸廓冇標胸椎。","D":"鎖骨、肩胛骨係上肢帶骨。"}}},{"id":"Q098","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p31（PDF p16）","question":"教材所講「上呼吸道」包括？","options":["鼻腔、咽、喉","喉、氣管、支氣管","咽、喉、氣管","鼻腔、氣管、支氣管"],"answer":"A","explanation":{"correct":"教材：「臨床上把喉以上的呼吸道稱為上呼吸道，包括鼻腔、咽、喉」。","wrong":{"B":"喉以上先算。","C":"氣管唔計。","D":"氣管、支氣管唔計。"}}},{"id":"Q099","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p36（PDF p21）","question":"以下邊項屬於女性「內」生殖器官？","options":["前庭","輸卵管","陰核","大前庭腺"],"answer":"B","explanation":{"correct":"教材：「內生殖器官（陰道、子宮、輸卵管、卵巢」。","wrong":{"A":"屬外生殖器官。","C":"屬外生殖器官。","D":"屬外生殖器官。"}}},{"id":"Q100","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"椎間板外殼日漸脆弱，裏面組織向外擠壓壓迫神經，一般人叫呢個做？","options":["駝背","脊柱前凸","坐骨神經痛","關節炎"],"answer":"C","explanation":{"correct":"教材：「也就是一般人所說的坐骨神經痛」。","wrong":{"A":"駝背係過度後凸。","B":"前凸係正常生理彎曲。","D":"教材冇呢個講法；教材嘅答案係「坐骨神經痛」。"}}},{"id":"Q101","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"以下邊組全部屬教材所列嘅關節運動？","options":["屈曲、伸展、內收、環轉","內旋、外旋、放鬆、屈曲","內收、外展、舒張、外旋","屈曲、伸展、收縮、環轉"],"answer":"A","explanation":{"correct":"教材：「屈曲、伸展、內收、外展、內旋、外旋及環轉」。","wrong":{"B":"放鬆唔喺關節運動清單。","C":"舒張唔喺關節運動清單。","D":"收縮唔喺關節運動清單。"}}},{"id":"Q102","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"內分泌系統嘅激素係點樣到達目標器官？","options":["經神經纖維傳導到達","經專用導管直接輸送","直接進入血液循環系統","經淋巴管道系統運送"],"answer":"C","explanation":{"correct":"教材：「無管腺所分泌之賀爾蒙／激素直接進入血液循環系統，運送到目標器官」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「直接進入血液循環系統」。","B":"教材話係無管腺，冇導管。","D":"教材話經血液循環，唔係淋巴。"}}},{"id":"Q103","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"內分泌系統負責調控體內邊類活動？","options":["即時的感覺傳導","快速而短暫之活動","緩慢而持久之活動","隨意肌肉的運動"],"answer":"C","explanation":{"correct":"教材：「和體內緩慢而持久之活動，如生長、發育、物質的平衡以及生殖等」。","wrong":{"A":"感覺功能屬神經系統。","B":"同教材相反。","D":"控制肌肉運動屬神經系統。"}}},{"id":"Q104","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p37（PDF p22）","question":"皮膚主要分為邊兩部份？","options":["表皮（外層）及皮下組織（內層）","真皮（外層）及表皮（內層）","真皮（外層）及皮下組織（內層）","表皮（外層）及真皮（內層）"],"answer":"D","explanation":{"correct":"教材：「主要分為表皮（外層）及真皮（內層）兩部份」。","wrong":{"A":"教材主要分表皮同真皮。","B":"內外倒轉。","C":"教材主要分表皮同真皮。"}}},{"id":"Q105","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p31（PDF p16）","question":"呼吸系統嘅功用係？","options":["運送氧氣到身體各器官及組織","呼出氧氣，吸入二氧化碳","將氣體儲存喺各級支氣管及肺泡","呼出二氧化碳，吸入新鮮氧氣"],"answer":"D","explanation":{"correct":"教材：「呼出二氧化碳，吸入新鮮氧氣」。","wrong":{"A":"係循環系統功能。","B":"倒轉咗。","C":"教材冇呢個講法；教材嘅答案係「呼出二氧化碳，吸入新鮮氧氣」。"}}},{"id":"Q106","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p35（PDF p20）","question":"肌肉系統嘅定義係？","options":["支持身體、保護內臟及作為肌肉附著","感應刺激並加以整合及控制全身功能","能收縮及放鬆而產生運動功能","由骨頭與骨頭或軟骨相連接組成"],"answer":"C","explanation":{"correct":"教材：「能收縮及放鬆而產生運動功能」。","wrong":{"A":"係骨骼系統。","B":"係神經系統。","D":"係關節定義。"}}},{"id":"Q107","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"教材所列腦嘅組成包括？","options":["大腦、中腦、腦幹、胸管、小腦","大腦、中腦、橋腦、脊髓、小腦","大腦、中腦、橋腦、延腦、小腦","大腦、小腦、腦垂腺、延腦、脊髓"],"answer":"C","explanation":{"correct":"教材：「腦（大腦、中腦、橋腦、延腦、小腦」。","wrong":{"A":"胸管屬淋巴系統。","B":"脊髓同腦並列，唔係腦嘅一部分。","D":"腦垂腺屬內分泌腺，脊髓另列。"}}},{"id":"Q108","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"血色素（Haemoglobin）喺邊種血細胞入面，功能係乜？","options":["白血球，攜帶氧氣","紅血球，攜帶氧氣","紅血球，免疫系統","血小板，血液凝結"],"answer":"B","explanation":{"correct":"教材：「紅血球：內有血色素（Haemoglobin），其功能是攜帶氧氣」。","wrong":{"A":"白血球涉及免疫系統。","C":"免疫係白血球。","D":"血小板冇血色素。"}}},{"id":"Q109","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"比較動脈同靜脈，教材提到靜脈有咩特點？","options":["較多彈性纖維，血管壁得兩層","較多彈性纖維，大多數有靜脈瓣膜","較少彈性纖維，血管壁得兩層","較少彈性纖維，大多數有靜脈瓣膜"],"answer":"D","explanation":{"correct":"教材：「但靜脈較少彈性纖維；大多數靜脈內有單向的瓣，稱為靜脈瓣膜」。","wrong":{"A":"彈性纖維同層數都錯。","B":"靜脈係較少彈性纖維。","C":"兩者皆分內膜、中膜、外膜三層。"}}},{"id":"Q110","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"頸椎、胸椎、腰椎嘅塊數分別係？","options":["5、12、7","12、7、5","7、5、12","7、12、5"],"answer":"D","explanation":{"correct":"教材：「頸椎（cervical vertebrae）7 塊、胸椎（thoracic vertebrae）12 塊」，腰椎 5 塊。","wrong":{"A":"頸椎同腰椎倒轉。","B":"頸椎同胸椎倒轉。","C":"胸椎同腰椎倒轉。"}}},{"id":"Q111","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"骨骼肌肉受乜嘢支配？如果受損會點？","options":["感覺神經元，受損可能造成肌肉癱瘓或無力","運動神經元，受損可能造成肌肉癱瘓或無力","自主神經系統，受損可能造成心跳加速","運動神經元，受損多數造成感覺麻木"],"answer":"B","explanation":{"correct":"教材：「骨骼肌肉受運動神經元的支配，所以當運動神經元受損，可能造成肌肉癱瘓或無力」。","wrong":{"A":"教材話係運動神經元。","C":"教材冇呢個講法；教材嘅答案係「運動神經元，受損可能造成肌肉癱瘓或無力」。","D":"教材話係癱瘓或無力。"}}},{"id":"Q112","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"自主神經系統包括？","options":["腦及脊髓","交感及副交感神經系統","運動神經元及感覺神經元","腦神經及脊神經"],"answer":"B","explanation":{"correct":"教材列「交感神經系統」及「副交感神經系統」。","wrong":{"A":"屬中樞神經系統。","C":"教材自主神經系統下冇咁列。","D":"屬周圍神經系統。"}}},{"id":"Q113","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p37（PDF p22）","question":"以下邊項係皮膚嘅功用？","options":["形成維生素 D","貯存鈣和磷質","製造血液","排出二氧化碳"],"answer":"A","explanation":{"correct":"教材：「分泌及排泄功能、形成維生素 D」。","wrong":{"B":"係骨骼功用。","C":"係骨骼功用。","D":"係呼吸系統功用。"}}},{"id":"Q114","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p27（PDF p12）","question":"心臟本身由乜嘢供給營養及氧份？","options":["左、右肺靜脈","左、右肺動脈","左、右冠狀動脈","上、下腔靜脈"],"answer":"C","explanation":{"correct":"教材：「心臟由左、右冠狀動脈來供給營養及氧份」。","wrong":{"A":"肺靜脈將血帶返左心房。","B":"肺動脈將血輸到肺。","D":"腔靜脈將缺氧血流回右心房。"}}},{"id":"Q115","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"以下邊項「唔係」骨骼系統嘅功用？","options":["貯存鈣和磷質","保護內臟","製造血液","分解食物為小分子"],"answer":"D","explanation":{"correct":"教材骨骼功用：「支持身體、保護內臟、作為肌肉附著而可運動、製造血液和貯存鈣和磷質」；分解食物屬消化系統。","wrong":{"A":"係骨骼功用。","B":"係骨骼功用。","C":"係骨骼功用。"}}},{"id":"Q116","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"教材指出邊條血管係「動脈送高含氧血」呢個規律嘅例外？","options":["肺動脈","冠狀動脈","上腔靜脈","主動脈"],"answer":"A","explanation":{"correct":"教材：「動脈是將高含氧血送出心臟的血管，除了肺動脈」。","wrong":{"B":"教材冇列佢做例外。","C":"上腔靜脈唔係動脈。","D":"主動脈輸出含氧血，唔係例外。"}}},{"id":"Q117","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"傷口癒合主要同邊種血液成份有關？","options":["紅血球","血漿","白血球","血小板"],"answer":"D","explanation":{"correct":"教材：「血小板：幫助血液凝結及傷口癒合」。","wrong":{"A":"紅血球攜帶氧氣。","B":"教材冇呢個講法；教材嘅答案係「血小板」。","C":"白血球涉及免疫系統。"}}},{"id":"Q118","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p36（PDF p21）","question":"泌尿系統嘅功用包括？","options":["運送營養、氧氣、激素及抗體到全身","將食物分解為小分子並吸收其產物","排出代謝廢物，調節水份及電解質","分泌性激素維持副性徵及繁殖後代"],"answer":"C","explanation":{"correct":"教材：「排出代謝廢物，調節體內之水份及電解質」。","wrong":{"A":"係循環系統。","B":"係消化系統。","D":"係生殖系統。"}}},{"id":"Q119","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"薦椎同尾椎嘅塊數分別係？","options":["薦椎 5 塊，尾椎 7 塊","薦椎 7 塊，尾椎 1 塊","薦椎 5 塊，尾椎 2～4 塊","薦椎 2～4 塊，尾椎 5 塊"],"answer":"C","explanation":{"correct":"教材：「薦椎（sacral）5 塊及 2～4 塊的尾椎」。","wrong":{"A":"尾椎係 2～4 塊。","B":"薦椎係 5 塊。","D":"倒轉咗。"}}},{"id":"Q120","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p33（PDF p18）","question":"以下邊組全部屬於下肢骨？","options":["肱骨、髕骨、脛骨、腓骨","股骨、髕骨、尺骨、腓骨","股骨、髕骨、脛骨、腓骨","股骨、橈骨、脛骨、腓骨"],"answer":"C","explanation":{"correct":"p33 圖下肢骨標示「股骨、髕骨、脛骨、腓骨」。","wrong":{"A":"肱骨屬上肢。","B":"尺骨屬上肢。","D":"橈骨屬上肢。"}}},{"id":"Q121","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"椎間板主要有咩作用？","options":["製造血液及貯存鈣質","緩和脊椎骨間的摩擦與拉傷","固定脊椎令佢唔可以彎曲","傳遞感覺訊息到大腦"],"answer":"B","explanation":{"correct":"教材：「緩和脊椎骨間的摩擦與拉傷」。","wrong":{"A":"係骨骼功用。","C":"教材話要靠椎間板先可以彎曲。","D":"教材冇呢個講法；教材嘅答案係「緩和脊椎骨間的摩擦與拉傷」。"}}},{"id":"Q122","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p36（PDF p21）","question":"教材將乳腺歸類為女性生殖系統嘅？","options":["外生殖器官","附屬器官","內分泌腺","內生殖器官"],"answer":"B","explanation":{"correct":"教材：「附屬器官（乳腺」。","wrong":{"A":"外生殖器官如大陰唇等。","C":"教材冇列喺內分泌腺。","D":"內生殖器官如子宮等。"}}},{"id":"Q123","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p27（PDF p12）","question":"心瓣嘅作用係乜？","options":["推動血液循環全身","防止血液倒流","進行氣體交換","供給心臟營養及氧份"],"answer":"B","explanation":{"correct":"教材：「心瓣的作用是防止血液倒流」。","wrong":{"A":"係心臟收縮力嘅作用（p38）。","C":"氣體交換喺肺氣泡進行。","D":"係冠狀動脈嘅作用。"}}},{"id":"Q124","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p35（PDF p20）","question":"以下邊項屬於大腸？","options":["十二指腸","乙狀結腸","空腸","迴腸"],"answer":"B","explanation":{"correct":"教材：「大腸（盲腸、升結腸、橫結腸、降結腸、乙狀結腸和直腸」。","wrong":{"A":"屬小腸。","C":"屬小腸。","D":"屬小腸。"}}},{"id":"Q125","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"以下邊個肺循環次序正確？","options":["右心室→主動脈瓣→肺動脈→肺部→肺靜脈","左心室→肺動脈瓣→肺動脈→肺部→肺靜脈","右心室→肺動脈瓣→肺動脈→肺部→肺靜脈","右心室→肺靜脈→肺部→肺動脈→左心房"],"answer":"C","explanation":{"correct":"教材：「右心室 → 肺動脈瓣 → 肺動脈 → 肺部 → 肺靜脈 → 左心房」。","wrong":{"A":"主動脈瓣屬體循環。","B":"肺循環由右心室開始。","D":"肺動脈同肺靜脈倒轉。"}}},{"id":"Q126","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p27（PDF p12）","question":"教材話舌尖主要感應邊啲味道？","options":["酸及苦","甜及鹹","鹹及苦","甜及酸"],"answer":"B","explanation":{"correct":"教材：「甜／鹹：舌尖」。","wrong":{"A":"酸喺舌緣，苦喺舌根。","C":"苦喺舌根。","D":"酸喺舌緣。"}}},{"id":"Q127","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"肺循環流程入面，血由右心房去右心室會經過？","options":["主動脈瓣","二尖瓣","三尖瓣","肺動脈瓣"],"answer":"C","explanation":{"correct":"教材：「右心房 → 三尖瓣 → 右心室」。","wrong":{"A":"主動脈瓣喺左心室之後。","B":"二尖瓣喺左心房同左心室之間。","D":"肺動脈瓣喺右心室之後。"}}},{"id":"Q128","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"神經系統嘅定義，以下邊項最準確？","options":["感應刺激並加以整合及控制全身的功能","將賀爾蒙直接送入血液循環運送到目標器官","調節體內水份及電解質的平衡","將組織間隙過多水份排出體外"],"answer":"A","explanation":{"correct":"教材：「感應刺激並加以整合及控制全身的功能」。","wrong":{"B":"係內分泌系統嘅定義。","C":"係泌尿系統嘅功用。","D":"係淋巴系統嘅功用。"}}},{"id":"Q129","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"以下邊項屬於中樞神經系統？","options":["脊髓","12 對腦神經","交感神經系統","31 對脊神經"],"answer":"A","explanation":{"correct":"中樞神經系統包括腦同「脊髓」。","wrong":{"B":"屬周圍神經系統。","C":"屬自主神經系統。","D":"屬周圍神經系統。"}}},{"id":"Q130","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"周圍神經系統包括幾多對腦神經同脊神經？","options":["12 對腦神經、33 對脊神經","12 對腦神經、31 對脊神經","10 對腦神經、31 對脊神經","31 對腦神經、12 對脊神經"],"answer":"B","explanation":{"correct":"教材：「12 對腦神經」「31 對脊神經」。","wrong":{"A":"33 係脊椎骨塊數，唔係脊神經對數。","C":"腦神經係 12 對。","D":"兩個數字倒轉。"}}},{"id":"Q131","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p33（PDF p18）","question":"上肢帶骨包括？","options":["肱骨及尺骨","鎖骨及肩胛骨","胸骨及肋骨","橈骨及尺骨"],"answer":"B","explanation":{"correct":"p33 圖標示上肢帶骨＝鎖骨＋肩胛骨。「人體骨骼圖」。","wrong":{"A":"屬上肢骨。","C":"屬胸廓。","D":"屬上肢骨。"}}},{"id":"Q132","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"體循環中，含氧血由邊度輸出？","options":["右心房經上腔靜脈","左心房經肺靜脈","左心室經主動脈","右心室經肺動脈"],"answer":"C","explanation":{"correct":"教材：「體循環是含氧的血液從左心室輸出，經主動脈到各器官組織」。","wrong":{"A":"腔靜脈係流入右心房。","B":"肺靜脈係流入左心房。","D":"係肺循環起點。"}}},{"id":"Q133","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"脊柱共由幾多塊脊椎骨組成？","options":["33 塊","24 塊","31 塊","26 塊"],"answer":"A","explanation":{"correct":"教材：「由 33 塊脊椎骨所組成」。","wrong":{"B":"同教材唔符；教材寫嘅係「33 塊」。","C":"31 係脊神經對數。","D":"同教材唔符；教材寫嘅係「33 塊」。"}}},{"id":"Q134","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"骨骼結構可以分為？","options":["頭顱骨及胸廓","上肢骨及下肢骨","中軸骨骼及四肢骨骼","脊柱及椎間板"],"answer":"C","explanation":{"correct":"教材：「中軸骨骼（Axial Skeleton）和四肢骨骼」。","wrong":{"A":"係圖中部位，唔係結構分類。","B":"只係四肢部分。","D":"係脊柱構造。"}}},{"id":"Q135","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"肺循環嘅功能係？","options":["將缺氧血經上下腔靜脈流回左心房再輸出","氧氣及二氧化碳在肺氣泡裏進行氣體交換","將營養、激素及抗體運送到各器官組織","將含氧血經主動脈送到各器官組織進行代謝"],"answer":"B","explanation":{"correct":"教材：「其功能為氧氣及二氧化碳在肺氣泡裏進行氣體交換」。","wrong":{"A":"腔靜脈流回右心房，而且屬體循環。","C":"係循環系統整體功能。","D":"係體循環。"}}},{"id":"Q136","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p27（PDF p12）","question":"除咗甜同鹹，舌尖仲對邊啲刺激敏感？","options":["痛覺、血壓、脈搏和呼吸","痛覺、溫度、觸覺和壓力","溫度、酸味、苦味和鹹味","聲音、光線、氣味和壓力"],"answer":"B","explanation":{"correct":"教材：「對痛覺、溫度、觸覺和壓力敏感」。","wrong":{"A":"血壓脈搏唔係舌尖感應。","C":"酸喺舌緣，苦喺舌根。","D":"舌頭唔感應聲音光線。"}}},{"id":"Q137","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"邊啲部位向前突出，被稱為脊柱前凸？","options":["頸部和胸部","頸部和腰部","腰部和尾部","胸部和尾部"],"answer":"B","explanation":{"correct":"教材：「頸部和腰部向前突出的脊柱彎曲被稱之為脊柱前凸」。","wrong":{"A":"胸部向後突出。","C":"尾部向後突出。","D":"係脊柱後凸。"}}},{"id":"Q138","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p32（PDF p17）","question":"教材話顱骨嘅關節除咗邊個之外都係不動關節？","options":["肩關節","顳頜關節","髖關節","膝關節"],"answer":"B","explanation":{"correct":"教材：「但顱骨的關節除顳頜關節外，均為不動關節，以縫合為主」。","wrong":{"A":"肩關節唔係顱骨關節。","C":"髖關節唔係顱骨關節。","D":"膝關節唔係顱骨關節。"}}},{"id":"Q139","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p30（PDF p15）","question":"以下邊項屬於淋巴系統？","options":["胰島","膀胱","腎上腺","脾臟"],"answer":"D","explanation":{"correct":"淋巴系統包括「扁桃體」及「脾臟」等。","wrong":{"A":"屬內分泌。","B":"屬泌尿系統。","C":"屬內分泌。"}}},{"id":"Q140","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p30（PDF p15）","question":"胸管同右淋巴管嘅長度分別係？","options":["30 公分、10 公分","40 公分、1 公分","20 公分、30 公分","1 公分、40 公分"],"answer":"B","explanation":{"correct":"教材：「胸管（Thoracic duct，40 公分長」「右淋巴管（Right lymphatic duct，1 公分長」。","wrong":{"A":"同教材唔符；教材寫嘅係「40 公分、1 公分」。","C":"20–30 公分係輸尿管長度。","D":"數字倒轉。"}}},{"id":"Q141","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"體循環流程入面，血由左心房去左心室會經過？","options":["肺動脈瓣","三尖瓣","二尖瓣","主動脈瓣"],"answer":"C","explanation":{"correct":"教材：「左心房 → 二尖瓣 → 左心室」。","wrong":{"A":"肺動脈瓣喺右心室之後。","B":"三尖瓣喺右心房同右心室之間。","D":"主動脈瓣喺左心室之後。"}}},{"id":"Q142","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p36（PDF p21）","question":"以下邊項屬於男性「內」生殖器官？","options":["陰囊","乳腺","陰莖","前列腺"],"answer":"D","explanation":{"correct":"男性內生殖器官：「睪丸、副睪丸、輸精管、精囊、前列腺和尿道」。","wrong":{"A":"屬男性外生殖器官。","B":"屬女性附屬器官。","C":"屬男性外生殖器官。"}}},{"id":"Q143","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p26（PDF p11）","question":"以下邊項「唔係」教材所列嘅內分泌腺？","options":["扁桃體","副甲狀腺","腦垂腺","胰島"],"answer":"A","explanation":{"correct":"內分泌腺列「腦垂腺、甲狀腺、副甲狀腺、腎上腺、胰島、睪丸和卵巢」；扁桃體屬 p30 淋巴系統。","wrong":{"B":"係內分泌腺。","C":"係內分泌腺。","D":"係內分泌腺。"}}},{"id":"Q144","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"血液同細胞組織之間進行物質交換嘅地方係？","options":["動脈","心瓣","微血管","靜脈"],"answer":"C","explanation":{"correct":"教材：「微血管是介於動脈和靜脈之間的血管，是血液和細胞組織之間進行物質交換的地方」。","wrong":{"A":"動脈負責將血送出心臟。","B":"心瓣防止血液倒流。","D":"靜脈負責將血送回心臟。"}}},{"id":"Q145","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"教材指出邊條血管係「靜脈送低含氧血回心」嘅例外？","options":["大靜脈","肺靜脈","下腔靜脈","肺動脈"],"answer":"B","explanation":{"correct":"教材：「靜脈是將低含氧血送回心臟的血管，除了肺靜脈」。","wrong":{"A":"肺循環起點嘅大靜脈帶缺氧血，唔係例外。","C":"下腔靜脈流回嘅係缺氧血，唔係例外。","D":"肺動脈唔係靜脈。"}}},{"id":"Q146","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p35（PDF p20）","question":"消化系統除咗分解食物，仲有咩功能？","options":["吸收分解後產物並將渣滓排出體外","將組織間隙過多水份排出體外","分泌激素調節生長發育及生殖功能","製造尿液並排出代謝廢物及多餘水份"],"answer":"A","explanation":{"correct":"教材：「也將食物分解後的產物吸收，並將未能被吸收的渣滓排出體外」。","wrong":{"B":"係淋巴系統。","C":"係內分泌系統。","D":"係泌尿系統。"}}},{"id":"Q147","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p27（PDF p12）","question":"酸味喺舌頭邊度感應？","options":["舌尖","舌緣","舌中","舌根"],"answer":"B","explanation":{"correct":"教材：「酸：舌緣」。","wrong":{"A":"舌尖感應甜及鹹。","C":"教材冇列舌中。","D":"舌根感應苦。"}}},{"id":"Q148","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p29（PDF p14）","question":"血離開左心室之後，下一個經過嘅係？","options":["二尖瓣","三尖瓣","肺動脈瓣","主動脈瓣"],"answer":"D","explanation":{"correct":"教材：「左心室 → 主動脈瓣 → 主動脈」。","wrong":{"A":"二尖瓣喺左心室之前。","B":"三尖瓣喺右心室之前。","C":"肺動脈瓣喺右心室之後。"}}},{"id":"Q149","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p31（PDF p16）","question":"左右肺嘅分葉，以下邊項正確？","options":["左肺兩葉，右肺三葉，左肺較大","左肺兩葉，右肺三葉，左肺較小","左肺三葉，右肺兩葉，左肺較大","左肺三葉，右肺兩葉，右肺較小"],"answer":"B","explanation":{"correct":"教材：「左肺共有兩葉，右肺則分為三葉，左肺較右肺小」。","wrong":{"A":"左肺較細。","C":"同教材相反。","D":"同教材相反。"}}},{"id":"Q150","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p34（PDF p19）","question":"長期姿勢不正令脊柱過度後凸，會形成？","options":["駝背","癱瘓","坐骨神經痛","骨質疏鬆"],"answer":"A","explanation":{"correct":"教材：「因長期姿勢不正或疾病影響而過度後凸，引起畸形，成為駝背」。","wrong":{"B":"教材將癱瘓同運動神經元受損連繫。","C":"坐骨神經痛源於椎間板外殼脆弱。","D":"教材冇呢個講法；教材嘅答案係「駝背」。"}}},{"id":"Q151","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p28（PDF p13）","question":"血液入面血漿同細胞嘅比例係？","options":["血漿 65%、細胞 35%","血漿 55%、細胞 45%","血漿 50%、細胞 50%","血漿 45%、細胞 55%"],"answer":"B","explanation":{"correct":"教材：「血漿 55」「細胞 45」。","wrong":{"A":"同教材唔符；教材寫嘅係「血漿 55%、細胞 45%」。","C":"同教材唔符；教材寫嘅係「血漿 55%、細胞 45%」。","D":"數字倒轉。"}}},{"id":"Q152","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p35（PDF p20）","question":"教材所列小腸包括？","options":["盲腸、升結腸、橫結腸","空腸、迴腸、直腸","十二指腸、盲腸、迴腸","十二指腸、空腸、迴腸"],"answer":"D","explanation":{"correct":"教材：「小腸（十二指腸、空腸和迴腸」。","wrong":{"A":"全部屬大腸。","B":"直腸屬大腸。","C":"盲腸屬大腸。"}}},{"id":"Q153","chapter":"第二章 人體結構及病理｜人體基本結構及功能","page":"印刷 p30（PDF p15）","question":"淋巴系統嘅功用係？","options":["製造血液及貯存鈣質","運送血液內的營養及氧氣","調節體內電解質平衡","將組織間隙過多水份排出"],"answer":"D","explanation":{"correct":"教材：「將組織間隙過多水份排出之系統」。","wrong":{"A":"係骨骼系統。","B":"係循環系統。","C":"係泌尿系統。"}}},{"id":"Q154","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39–40（PDF p24–25）","question":"某人體重 60 公斤、身高 1.6 米，按教材標準屬於？","options":["肥胖","適中","過輕","過重"],"answer":"D","explanation":{"correct":"60÷1.6²＝23.4，教材：「體重指標為 23－24.9 屬於過重」。","wrong":{"A":"肥胖係≥25。","B":"適中係 18.5–22.9。","C":"過輕係少於 18.5。"}}},{"id":"Q155","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p38（PDF p23）","question":"血管阻力同血壓嘅關係，教材點講？","options":["血管阻力越大，血壓越低","血管阻力同血壓無關","血管阻力越大，血壓越高","血管阻力越小，血壓越高"],"answer":"C","explanation":{"correct":"教材：「當血管阻力越大，血壓便會越高」。","wrong":{"A":"方向相反。","B":"教材話兩者有關。","D":"方向相反。"}}},{"id":"Q156","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"酒精點樣令血壓上升？","options":["令水份儲留，血管壁水腫增厚","刺激中樞神經產生興奮，心跳加速","令脂肪積聚於血管內，增加阻力","令腎上腺腫瘤增生，激素上升"],"answer":"B","explanation":{"correct":"教材：「酒精會刺激中樞神經而產生興奮，心跳加速，血壓上升」。","wrong":{"A":"係吃太鹹嘅機制。","C":"係膽固醇及脂肪嘅機制。","D":"教材冇呢個講法；教材嘅答案係「刺激中樞神經產生興奮，心跳加速」。"}}},{"id":"Q157","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"教材將「工作壓力」歸入高血壓邊類危險因素？","options":["心理因素","生理因素","遺傳因素","外在因素"],"answer":"D","explanation":{"correct":"外在因素 vi 項列「工作壓力」。","wrong":{"A":"心理因素列情緒緊張、脾氣不好等，冇工作壓力。","B":"生理因素係年齡、性別、肥胖。","C":"遺傳因素獨立一項。"}}},{"id":"Q158","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"高血壓影響腦部，短暫缺血嘅症狀包括？","options":["暴燥不安、注意力減低、短暫失去知覺","胸口悶痛、呼吸短促、冒汗","口乾、多尿、體重下降","視力模糊、耳鳴、半身麻痺持續一週"],"answer":"A","explanation":{"correct":"教材：「症狀為暴燥不安，注意力減低，甚至有短暫性的突然失去知覺」。","wrong":{"B":"係心絞痛相關症狀。","C":"係糖尿病相關症狀。","D":"教材冇呢個講法；教材嘅答案係「暴燥不安、注意力減低、短暫失去知覺」。"}}},{"id":"Q159","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p44（PDF p27）","question":"按教材熱量表，以下邊項熱量最高？（100 克）","options":["午餐肉","煎豬扒","火腿","煎煙肉"],"answer":"D","explanation":{"correct":"「煎煙肉」674 千卡，係肉類最高。","wrong":{"A":"335 千卡。","B":"451 千卡。","C":"389 千卡。"}}},{"id":"Q160","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"高血壓影響心臟，教材話會引起？","options":["右心房擴大及肺靜脈硬化","左心房萎縮及心瓣倒流","左心室肥厚、擴大及衰竭","右心室肥厚、擴大及衰竭"],"answer":"C","explanation":{"correct":"教材：「繼而左心室肥厚、擴大及衰竭」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「左心室肥厚、擴大及衰竭」。","B":"教材冇呢個講法；教材嘅答案係「左心室肥厚、擴大及衰竭」。","D":"教材話係左心室。"}}},{"id":"Q161","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"中央肥胖嘅標準係？","options":["女性腰圍 90cm 或以上，男性 80cm 或以上","女性腰圍 85cm 或以上，男性 95cm 或以上","女性腰圍 80cm 或以上，男性 90cm 或以上","女性腰圍 75cm 或以上，男性 85cm 或以上"],"answer":"C","explanation":{"correct":"教材：「女性腰圍 80cm 或以上」「男性腰圍 90cm 或以上」。","wrong":{"A":"倒轉。","B":"同教材唔符；教材寫嘅係「女性腰圍 80cm 或以上，男性 90cm 或以上」。","D":"同教材唔符；教材寫嘅係「女性腰圍 80cm 或以上，男性 90cm 或以上」。"}}},{"id":"Q162","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39（PDF p24）","question":"BMI 嘅計算方法係？","options":["體重（磅）÷ 身高（厘米）²","體重（公斤）÷ 身高（米）","身高（米）÷ 體重（公斤）²","體重（公斤）÷ 身高（米）²"],"answer":"D","explanation":{"correct":"教材：「體重指標 = 體重（公斤）／身高（米）²」。","wrong":{"A":"單位錯。","B":"身高要平方。","C":"倒轉。"}}},{"id":"Q163","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p38（PDF p23）","question":"病人量到一次血壓偏高，當時好緊張，教材建議？","options":["再作觀察或請教醫生","唔使理會亦毋須再量","即刻開始服降壓藥","即刻定為高血壓"],"answer":"A","explanation":{"correct":"教材：「並不一定代表高血壓，應再作觀察或請教醫生」。","wrong":{"B":"教材要求再作觀察。","C":"教材冇呢個講法；教材嘅答案係「再作觀察或請教醫生」。","D":"教材話偶然升高未必係高血壓。"}}},{"id":"Q164","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"以下邊項屬於高血壓嘅「心理因素」？","options":["工作壓力、茶或咖啡","脾氣不好、焦慮或易怒","家族遺傳","隨年齡增長、肥胖"],"answer":"B","explanation":{"correct":"教材：「心理因素：情緒緊張、脾氣不好、焦慮或易怒者」。","wrong":{"A":"屬外在因素。","C":"屬遺傳因素。","D":"屬生理因素。"}}},{"id":"Q165","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39（PDF p24）","question":"更年期前，教材話血壓性別差異係點？","options":["通常女性比男性高","男女冇分別","通常男性比女性高","女性較易波動"],"answer":"C","explanation":{"correct":"教材：「在更年期前，通常男性的血壓比女性高」。","wrong":{"A":"相反。","B":"教材有講差異。","D":"教材冇呢個講法；教材嘅答案係「通常男性比女性高」。"}}},{"id":"Q166","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"高血壓點解又叫「無形殺手」？","options":["原因不明且無藥可治","併發症多數喺睡眠時發作","大部份病人均無異常症狀","小部份病人有頭痛及頭暈"],"answer":"C","explanation":{"correct":"教材：「大部份病人均無異常症狀，故高血壓又稱為「無形殺手」。","wrong":{"A":"教材話藥物治療效果通常很理想。","B":"教材冇呢個講法；教材嘅答案係「大部份病人均無異常症狀」。","D":"有症狀嘅只係小部份，唔係命名原因。"}}},{"id":"Q167","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39（PDF p24）","question":"以下邊項會引起繼發性高血壓？","options":["甲狀腺機能亢進症","更年期前的性別差異","遺傳因素","中年以後發病"],"answer":"A","explanation":{"correct":"教材：「由其他疾病引起，例如腎病，腎上腺腫瘤，甲狀腺機能亢進症」。","wrong":{"B":"係生理危險因素。","C":"同原發性有關。","D":"係原發性特點。"}}},{"id":"Q168","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"高血壓影響眼部，以下邊項正確？","options":["眼底動脈硬化、水腫及出血，嚴重可致失明","眼底靜脈硬化及萎縮，症狀為雙眼乾澀","視網膜血管瘤及阻塞，嚴重可致青光眼","角膜水腫及發炎，症狀為畏光及流淚"],"answer":"A","explanation":{"correct":"教材：「眼底動脈硬化、水腫及出血」，症狀視力模糊，嚴重者可致失明。","wrong":{"B":"教材話係動脈，症狀係視力模糊。","C":"血管瘤喺 p54 屬糖尿病視網膜病變，亦冇提青光眼。","D":"教材冇呢個講法；教材嘅答案係「眼底動脈硬化、水腫及出血，嚴重可致失明」。"}}},{"id":"Q169","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"吃太鹹點解會令血壓上升？","options":["刺激中樞神經產生興奮，心跳加速","水份儲留，血管壁水腫增厚，內腔收窄","脂肪積聚血管內，增加血管阻力及負荷","尼古丁使血管收縮，心跳加快而血壓上升"],"answer":"B","explanation":{"correct":"教材：「引致水份儲留，更令血管壁水腫增厚，內腔收窄而使血壓上升」。","wrong":{"A":"係酒精機制。","C":"係膽固醇及脂肪機制。","D":"係吸煙機制。"}}},{"id":"Q170","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p38（PDF p23）","question":"Diastolic Pressure 係指？","options":["血管阻力下降時的壓力","血液衝擊心瓣產生的壓力","心臟舒張時血管壁承受的壓力","心臟收縮時血管壁承受的壓力"],"answer":"C","explanation":{"correct":"教材：心臟舒張時「舒張壓（下壓 Diastolic Pressure」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「心臟舒張時血管壁承受的壓力」。","B":"教材冇呢個講法；教材嘅答案係「心臟舒張時血管壁承受的壓力」。","D":"係 Systolic Pressure。"}}},{"id":"Q171","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"高血壓影響腎臟，嚴重者會有？","options":["腎結石、膀胱炎、血尿","輸尿管狹窄、尿道感染","腎上腺腫瘤、甲亢","腎衰竭、腎萎縮、尿毒症"],"answer":"D","explanation":{"correct":"教材：「嚴重者會有腎衰竭、腎萎縮、腎機能不全、尿毒症」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「腎衰竭、腎萎縮、尿毒症」。","B":"教材冇呢個講法；教材嘅答案係「腎衰竭、腎萎縮、尿毒症」。","C":"呢啲喺 p39 係繼發性高血壓成因。"}}},{"id":"Q172","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"利尿劑點樣降血壓？","options":["減慢心跳，減少耗氧量","抑制腸胃對鹽份的吸收","令體內血管舒張","通過排尿，減低體內積水"],"answer":"D","explanation":{"correct":"教材：「利尿劑（通過排尿，減低體內積水，從而降低血壓」。","wrong":{"A":"係 p51 冠心病藥物治療。","B":"教材冇呢個講法；教材嘅答案係「通過排尿，減低體內積水」。","C":"係血管擴張藥。"}}},{"id":"Q173","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"教材 BMI「適中」嘅範圍係？","options":["23–24.9","20–24.9","18.5–22.9","18.5–24.9"],"answer":"C","explanation":{"correct":"教材：「體重指標為 18.5－22.9 屬於適中」。","wrong":{"A":"係過重範圍。","B":"下限同上限都同教材唔符。","D":"23–24.9 已屬過重。"}}},{"id":"Q174","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"吸煙令血壓上升，教材解釋係因為尼古丁令？","options":["血管舒張，心跳減慢","血管舒張，心跳加快","血管收縮，心跳減慢","血管收縮，心跳加快"],"answer":"D","explanation":{"correct":"教材：「尼古丁能使血管收縮，心跳加快，引致血壓上升」。","wrong":{"A":"方向相反。","B":"血管係收縮。","C":"心跳係加快。"}}},{"id":"Q175","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p38（PDF p23）","question":"根據教材，符合「定為高血壓」要點係？","options":["休息狀態下，收縮壓偶然≥140、舒張壓偶然≥90 mmHg","活動狀態下，收縮壓持續≥140、舒張壓持續≥90 mmHg","休息狀態下，收縮壓持續≥140、舒張壓持續≥90 mmHg","休息狀態下，收縮壓持續≥120、舒張壓持續≥80 mmHg"],"answer":"C","explanation":{"correct":"教材：「若血壓數值於休息狀態下，收縮壓持續地高於或等於 140mmHg，舒張壓持續地高於或等於 90mmHg」。","wrong":{"A":"教材要求持續，偶然升高未必代表高血壓。","B":"教材要求休息狀態。","D":"數值同教材唔符。"}}},{"id":"Q176","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p38（PDF p23）","question":"心臟收縮時血管壁承受嘅壓力叫乜？","options":["舒張壓（下壓）","收縮壓（下壓）","舒張壓（上壓）","收縮壓（上壓）"],"answer":"D","explanation":{"correct":"教材：心臟收縮時血管壁所承受的壓力「收縮壓（上壓 Systolic Pressure」。","wrong":{"A":"舒張壓係心臟舒張時嘅壓力。","B":"收縮壓即上壓。","C":"舒張壓即下壓。"}}},{"id":"Q177","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39–40（PDF p24–25）","question":"某人體重 72 公斤、身高 1.6 米，按教材公式同標準屬於？","options":["肥胖","過重","適中","過輕"],"answer":"A","explanation":{"correct":"72÷1.6²＝28.1，教材：「體重指標大過或等於 25 屬於肥胖」。","wrong":{"B":"過重係 23–24.9。","C":"適中係 18.5–22.9。","D":"過輕係少於 18.5。"}}},{"id":"Q178","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p41（PDF p26）","question":"以下邊項係高血壓「嚴重者」嘅症狀？","options":["流鼻血、抽搐、昏迷","頭痛、耳鳴、失眠","心悸、兩肩酸痛","疲倦、眼花、沒精打采"],"answer":"A","explanation":{"correct":"教材嚴重者：「流鼻血，噁心、嘔吐、抽搐、昏迷等」。","wrong":{"B":"屬小部份病人症狀。","C":"屬小部份病人症狀。","D":"屬小部份病人症狀。"}}},{"id":"Q179","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p39（PDF p24）","question":"原發性高血壓佔幾多，成因點？","options":["百分之十，由其他疾病引起","百分之九十，原因不明","百分之十，原因不明","百分之九十，由其他疾病引起"],"answer":"B","explanation":{"correct":"教材：「百分之九十原因不明，相信與遺傳因素及生活習慣有關」。","wrong":{"A":"呢個係繼發性。","C":"原發性佔九成。","D":"由其他疾病引起係繼發性。"}}},{"id":"Q180","chapter":"第二章 人體結構及病理｜高血壓","page":"印刷 p40（PDF p25）","question":"教材 BMI 指數「不適用」於邊類人士？","options":["65 歲以上長者或更年期婦女","18 歲以下兒童或更年期婦女","18 歲以下兒童或懷孕期婦女","運動員或糖尿病患者"],"answer":"C","explanation":{"correct":"教材註：「不適用於 18 歲以下的兒童或懷孕期的婦女」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「18 歲以下兒童或懷孕期婦女」。","B":"係懷孕期，唔係更年期。","D":"教材冇呢個講法；教材嘅答案係「18 歲以下兒童或懷孕期婦女」。"}}},{"id":"Q181","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p47（PDF p30）","question":"餵中風病人進食，以下邊項正確？","options":["確定完全吞嚥後才送第二口","食物放喺患側視線外以訓練患側","半臥床上進食以減少疲勞","每一口分量多些以縮短進食時間"],"answer":"A","explanation":{"correct":"教材：「在確定完全吞嚥下去之後，再送入第二口」。","wrong":{"B":"教材話食物置於視線範圍內。","C":"教材話坐起身用餐。","D":"教材話每口分量要少一些。"}}},{"id":"Q182","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p47（PDF p30）","question":"中風病人揀選食物防止哽嚥，應根據邊位嘅指示？","options":["營養師","物理治療師","言語治療師","職業治療師"],"answer":"C","explanation":{"correct":"教材：「根據言語治療師的指示，選擇適當食物防止哽嚥」。","wrong":{"A":"教材中風進食呢項講言語治療師。","B":"教材冇呢個講法；教材嘅答案係「言語治療師」。","D":"教材冇呢個講法；教材嘅答案係「言語治療師」。"}}},{"id":"Q183","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"教材對中風預後點講？","options":["輕微中風先有機會康復","經治療後亦有機會完全康復","經治療後多數未能完全康復","康復多限於言語能力"],"answer":"B","explanation":{"correct":"教材：「但經治療後亦有機會完全康復」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「經治療後亦有機會完全康復」。","C":"同教材相反。","D":"教材冇呢個講法；教材嘅答案係「經治療後亦有機會完全康復」。"}}},{"id":"Q184","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p45（PDF p28）","question":"Stroke 喺教材嘅另一個英文名稱係？","options":["Chronic Obstructive Pulmonary Disease","Cerebral Vascular Accident","Coronary Artery Disease","Cardiac Care Unit"],"answer":"B","explanation":{"correct":"教材：「腦血管意外（中風 Stroke／Cerebral Vascular Accident」。","wrong":{"A":"係慢性阻塞性肺病。","C":"係冠狀動脈病。","D":"係心臟科深切治療部。"}}},{"id":"Q185","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"中風病人情緒低落，教材將佢嘅情緒問題舉例為？","options":["焦慮","恐懼","躁狂","抑鬱"],"answer":"D","explanation":{"correct":"併發症列「情緒問題（抑鬱」。","wrong":{"A":"教材括號只寫抑鬱。","B":"教材括號只寫抑鬱。","C":"教材括號只寫抑鬱。"}}},{"id":"Q186","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"以下邊項係教材所列中風危險因素？","options":["先天性腦血管腫瘤或血管壁過薄","先天性抗蛋白質酵素不足及遺傳","甲狀腺機能亢進症及腎上腺腫瘤","長期自體免疫系統疾病"],"answer":"A","explanation":{"correct":"教材：「先天性腦血管腫瘤或血管壁過薄」。","wrong":{"B":"係慢性阻塞性肺病高危因素。","C":"係繼發性高血壓成因。","D":"係一型糖尿病。"}}},{"id":"Q187","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p47（PDF p30）","question":"同中風病人溝通，以下邊項符合教材？","options":["說話慢且清楚，勿一次給太多指示","病人智能多數受損，應由家屬代答","說話要快，趁病人集中時交代各項指示","盡量用手勢代替，減少病人開口"],"answer":"A","explanation":{"correct":"教材：「對病人說話要慢且清楚，勿一次給太多的指示」。","wrong":{"B":"教材話智能可能仍是正常。","C":"同教材相反。","D":"教材鼓勵病人盡量以語言表達。"}}},{"id":"Q188","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"中風病人吞嚥困難，應該由邊種治療協助改善？","options":["物理治療","職業治療","言語治療","營養治療"],"answer":"C","explanation":{"correct":"教材：「協助改善中風患者的吞嚥、溝通及表達的能力」，屬言語治療。","wrong":{"A":"物理治療針對身體功能及運動。","B":"職業治療針對自理及生活。","D":"教材中風康復冇列呢項。"}}},{"id":"Q189","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"協助中風患者喺家居操作、工作及消閒生活獲得最高自理能力，係邊種治療？","options":["言語治療","物理治療","職業治療","臨床心理"],"answer":"C","explanation":{"correct":"教材：「職業治療：透過不同治療方案，讓中風患者在自我照顧、家居操作、工作及消閒生活」。","wrong":{"A":"言語治療改善吞嚥、溝通及表達。","B":"物理治療恢復身體功能、指導護理及運動。","D":"臨床心理處理心理及情緒問題。"}}},{"id":"Q190","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"以下邊項屬於「缺血性」腦血管病？","options":["腦出血","腦血栓形成","腦溢血","血管壁過薄"],"answer":"B","explanation":{"correct":"教材：「缺血性腦血管病：短暫性腦缺血發作；腦血栓形成；腦栓塞等」。","wrong":{"A":"屬出血性。","C":"教材 p41 寫腦中風（腦溢血），唔屬缺血性。","D":"係危險因素，唔係種類。"}}},{"id":"Q191","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"以下邊項屬於「出血性」腦血管病？","options":["腦血栓形成","腦出血","腦栓塞","短暫性腦缺血發作"],"answer":"B","explanation":{"correct":"教材：「出血性腦血管病：腦出血」。","wrong":{"A":"屬缺血性。","C":"屬缺血性。","D":"屬缺血性。"}}},{"id":"Q192","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p48（PDF p31）","question":"教材話中風嘅主要成因係？","options":["先天血管腫瘤、年齡和飲酒","高膽固醇、感染和壓力","糖尿、過重和缺乏運動","吸煙、血壓高和血管硬化"],"answer":"D","explanation":{"correct":"教材：「中風的主要成因是吸煙、血壓高和血管硬化」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「吸煙、血壓高和血管硬化」。","B":"教材冇呢個講法；教材嘅答案係「吸煙、血壓高和血管硬化」。","C":"教材列做危險因素，唔係主要成因。"}}},{"id":"Q193","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p47（PDF p30）","question":"中風病人坐立時，枕頭應該點樣擺？","options":["墊喺腰背及兩膝下方，雙手自然下垂","墊於患側肩及上臂下方，健肢亦用枕頭扶托","墊於健側肩及上臂下方，患肢亦用枕頭扶托","墊於健側手腕及手肘，患肢懸空保持活動"],"answer":"C","explanation":{"correct":"教材：「用枕頭墊於健側肩及上臂下方」「患肢應用枕頭予以扶托」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「墊於健側肩及上臂下方，患肢亦用枕頭扶托」。","B":"側別倒轉。","D":"教材要求扶托患肢。"}}},{"id":"Q194","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"以下邊項係教材所列中風後常見併發症？","options":["骨質疏鬆","高血糖昏睡","患側肌肉痙攣","結核菌抗藥性"],"answer":"C","explanation":{"correct":"併發症列有「患側肌肉痙攣」。","wrong":{"A":"教材清單冇列。","B":"屬糖尿病急性併發症。","D":"屬肺結核。"}}},{"id":"Q195","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46–47（PDF p29–30）","question":"中風家屬需要經濟援助及院舍服務，應該轉介邊位？","options":["職業治療師","醫務社工","物理治療師","臨床心理學家"],"answer":"B","explanation":{"correct":"教材：「醫務社工服務可協助中風患者及家屬處理經濟援助、房屋、家務助理、就職安排、院舍服務」。","wrong":{"A":"協助自理能力。","C":"協助身體功能。","D":"處理心理及情緒問題。"}}},{"id":"Q196","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"教材提到會令中風危險倍增嘅疾病例子係？","options":["糖尿病、風濕性心臟病","矽肺、愛滋病感染","肺結核、慢性阻塞性肺病","腎病、腎上腺腫瘤"],"answer":"A","explanation":{"correct":"教材：「其他疾病例如糖尿病、風濕性心臟病等會令中風危險倍增」。","wrong":{"B":"係 p58 減弱抵抗力嘅疾病。","C":"教材冇呢個講法；教材嘅答案係「糖尿病、風濕性心臟病」。","D":"係繼發性高血壓成因。"}}},{"id":"Q197","chapter":"第二章 人體結構及病理｜中風","page":"印刷 p46（PDF p29）","question":"以下邊項「唔係」教材所列中風徵狀？","options":["嘴歪","吞嚥困難","胸骨後刺痛","大小便失禁"],"answer":"C","explanation":{"correct":"教材徵狀：「半身不遂、言語不清、嘴歪、眼斜、流口水、吞嚥困難、大小便失禁、感覺麻木」；胸骨後刺痛屬心肌梗塞。","wrong":{"A":"係中風徵狀。","B":"係中風徵狀。","D":"係中風徵狀。"}}},{"id":"Q198","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p51（PDF p34）","question":"俗稱「通波仔」嘅手術係？","options":["冠狀動脈擴大術","冠狀動脈再成形術","主動脈瓣置換術","冠狀動脈繞道術"],"answer":"B","explanation":{"correct":"教材：「冠狀動脈再成形術（俗稱通波仔，P.T.C.A」。","wrong":{"A":"教材冇稱之為通波仔。","C":"教材冇呢個講法；教材嘅答案係「冠狀動脈再成形術」。","D":"俗稱搭橋手術。"}}},{"id":"Q199","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p50（PDF p33）","question":"心肌梗塞點解有時被誤認為胃痛？","options":["發作時常有作嘔或嘔吐","痛楚有時會位於「心窩」","多發生於飯後一小時內","服用胃藥後痛楚可舒緩"],"answer":"B","explanation":{"correct":"教材：「痛楚有時會位於「心窩」，常被誤認為是胃痛」。","wrong":{"A":"作嘔或嘔吐係徵狀，但教材誤認原因係痛位。","C":"教材冇呢個講法；教材嘅答案係「痛楚有時會位於「心窩」」。","D":"教材冇呢個講法；教材嘅答案係「痛楚有時會位於「心窩」」。"}}},{"id":"Q200","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"心絞痛痛楚最常見嘅位置係？","options":["心前或胸骨之下，或偏左側乳房","上腹心窩位置，有時偏右側肋骨","背部及腰部位置，有時傳至大腿","右上腹及右肩位置，有時傳至背"],"answer":"A","explanation":{"correct":"教材：「最常見位置是心前或胸骨之下，或者偏左側乳房的位置」。","wrong":{"B":"心窩係 p50 心肌梗塞有時嘅痛位。","C":"教材冇呢個講法；教材嘅答案係「心前或胸骨之下，或偏左側乳房」。","D":"教材冇呢個講法；教材嘅答案係「心前或胸骨之下，或偏左側乳房」。"}}},{"id":"Q201","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"大部分心絞痛由乜嘢引起？","options":["冠狀動脈粥樣硬化","肺靜脈阻塞及收窄","心瓣閉合不全","腦血管破裂及阻塞"],"answer":"A","explanation":{"correct":"教材：「大部分由冠狀動脈的疾病（粥樣硬化）引起」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「冠狀動脈粥樣硬化」。","C":"教材冇呢個講法；教材嘅答案係「冠狀動脈粥樣硬化」。","D":"係中風相關。"}}},{"id":"Q202","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"冠心病發時，未及送抵醫院已死亡嘅比例係？","options":["百份之九十","百份之六十","百份之五至十","百份之三十"],"answer":"B","explanation":{"correct":"教材：「百份之六十的患者未及送抵醫院已經死亡」。","wrong":{"A":"同教材唔符；教材寫嘅係「百份之六十」。","C":"五至十係喺醫院死亡。","D":"三十係復原後再度發作。"}}},{"id":"Q203","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"冠心病嘅另一個名稱係？","options":["先天性心臟病","高血壓性心臟病","缺血性心臟病","風濕性心臟病"],"answer":"C","explanation":{"correct":"教材：「全名冠狀動脈心臟病，又名缺血性心臟病」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「缺血性心臟病」。","B":"教材冇呢個講法；教材嘅答案係「缺血性心臟病」。","D":"p46 提及，但唔係冠心病別名。"}}},{"id":"Q204","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p51（PDF p34）","question":"「在病人身體取出一段血管作橋」係邊種手術？","options":["支架血管成形術","冠狀動脈擴大術","冠狀動脈繞道術","冠狀動脈再成形術"],"answer":"C","explanation":{"correct":"教材：「冠狀動脈繞道術（搭橋手術）：在病人身體取出一段血管作橋」。","wrong":{"A":"教材歸於再成形術，唔係取血管。","B":"係插導管擴大。","D":"經皮腔內血管成形，唔係取血管。"}}},{"id":"Q205","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"眾多心臟病之中，冠心病死亡人數佔幾多？","options":["六成","五成","九成","三成"],"answer":"A","explanation":{"correct":"教材：「冠心病的死亡人數佔六成」。","wrong":{"B":"同教材唔符；教材寫嘅係「六成」。","C":"同教材唔符；教材寫嘅係「六成」。","D":"同教材唔符；教材寫嘅係「六成」。"}}},{"id":"Q206","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"心絞痛厲害時痛楚可以傳去邊度？","options":["右上臂、右肩和背部","腹部、大腿和足部","腰部、足部和指尖","頸部或左上臂和指尖"],"answer":"D","explanation":{"correct":"教材：「厲害時可以傳至頸部或左上臂和指尖」。","wrong":{"A":"教材寫左上臂。","B":"教材冇呢個講法；教材嘅答案係「頸部或左上臂和指尖」。","C":"教材冇呢個講法；教材嘅答案係「頸部或左上臂和指尖」。"}}},{"id":"Q207","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49–50（PDF p32–33）","question":"病人行路時突然心絞痛，首要處理係？","options":["即刻平臥，將雙腳抬高","先扶佢返病房再報告護士","終止一切活動，坐下或半坐臥休息","繼續慢行，令血液循環回復正常"],"answer":"C","explanation":{"correct":"教材：「立刻終止病人一切活動，坐下或半坐臥休息，以減少心臟負荷」。","wrong":{"A":"教材話坐下或半坐臥。","B":"教材要即刻停止活動及通知醫護人員。","D":"同教材相反。"}}},{"id":"Q208","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p51（PDF p34）","question":"教材提到邊種性格較易發生冠心病？","options":["內向沉默、不善與人交際","個性緊張、事事分秒必爭","隨和樂觀、喜歡做運動","生性輕鬆、容易滿足"],"answer":"B","explanation":{"correct":"教材：「個性緊張，事事分秒必爭，匆匆忙忙的人較易發生」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「個性緊張、事事分秒必爭」。","C":"教材冇呢個講法；教材嘅答案係「個性緊張、事事分秒必爭」。","D":"教材話呢類人不易患上。"}}},{"id":"Q209","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p51（PDF p34）","question":"冠心病藥物治療主要點樣幫病人？","options":["抑制腸胃吸收脂肪，降低體重","溶解血管內脂肪，長遠不再服藥","降低血壓及心跳，減少心肌耗氧量","提高血壓及心跳，增加心肌供氧"],"answer":"C","explanation":{"correct":"教材：「幫助降低血壓及心跳，因而減少心肌的耗氧量」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「降低血壓及心跳，減少心肌耗氧量」。","B":"教材冇呢個講法；教材嘅答案係「降低血壓及心跳，減少心肌耗氧量」。","D":"方向相反。"}}},{"id":"Q210","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p50（PDF p33）","question":"心肌梗塞嘅痛楚同心絞痛最大分別係？","options":["多數出現喺劇烈運動之後，停止運動即舒緩","持續多於半小時，不能因短暫休息而舒緩","通常幾分鐘內消失，短暫休息後便會舒緩","痛楚較輕，屬一次性發作，之後唔會復發"],"answer":"B","explanation":{"correct":"教材：「持續時間多於半小時，不能因短暫休息而舒緩」。","wrong":{"A":"教材話常發於早晨後數小時內。","C":"係心絞痛特點。","D":"教材話非常嚴重且會復發。"}}},{"id":"Q211","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p49（PDF p32）","question":"冠心病主要分為邊兩大類？","options":["心絞痛及心肌梗塞","心瓣倒流及心肌梗塞","心絞痛及心臟衰竭","心肌梗塞及心律不正"],"answer":"A","explanation":{"correct":"教材：「主要分為兩大類」：「心絞痛」「心肌梗塞」。","wrong":{"B":"教材冇列為兩大類。","C":"教材冇列為兩大類。","D":"教材冇列為兩大類。"}}},{"id":"Q212","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p52（PDF p35）","question":"教材話心絞痛病人平時應攜帶乜嘢以便應急？","options":["胰島素注射筆及血糖機","P.P.E. 及消毒酒精棉塊","血壓計及利尿劑藥物","舌底丸及病情記錄卡"],"answer":"D","explanation":{"correct":"教材：「攜帶舌底丸（T.N.G」及「病人應經常攜帶病情記錄卡」。","wrong":{"A":"屬糖尿病範疇。","B":"教材冇呢個講法；教材嘅答案係「舌底丸及病情記錄卡」。","C":"教材冇呢個講法；教材嘅答案係「舌底丸及病情記錄卡」。"}}},{"id":"Q213","chapter":"第二章 人體結構及病理｜冠心病","page":"印刷 p50（PDF p33）","question":"心肌梗塞以下徵狀邊項正確？","options":["血壓下降、脈搏慢而強","血壓上升、脈搏速而強","血壓下降、脈搏速而弱","血壓上升、脈搏慢而強"],"answer":"C","explanation":{"correct":"教材：「血壓下降」「脈搏速而弱」。","wrong":{"A":"脈搏係速而弱。","B":"血壓同脈搏強度都錯。","D":"同教材相反。"}}},{"id":"Q214","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p53（PDF p36）","question":"二型糖尿病又叫？","options":["自體免疫型糖尿病","胰島素依賴型糖尿病","妊娠型糖尿病","非胰島素依賴型糖尿病"],"answer":"D","explanation":{"correct":"教材：「二型（非胰島素依賴型」。","wrong":{"A":"自體免疫係一型特點。","B":"係一型。","C":"教材冇呢個講法；教材嘅答案係「非胰島素依賴型糖尿病」。"}}},{"id":"Q215","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p57（PDF p40）","question":"教材所列預防糖尿病嘅方法係？","options":["低脂飲食、足夠休息、定期覆診","高蛋白飲食、劇烈運動、定期量體重","均衡營養、適量運動、良好的飲食習慣","戒除煙酒、保持心境平和、定期驗血"],"answer":"C","explanation":{"correct":"教材：「均衡營養」「適量運動」「良好的飲食習慣」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「均衡營養、適量運動、良好的飲食習慣」。","B":"教材冇呢個講法；教材嘅答案係「均衡營養、適量運動、良好的飲食習慣」。","D":"接近中風預防內容。"}}},{"id":"Q216","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"教材列出嘅糖尿病治療組合，共通點係都包括？","options":["口服降血糖藥","適量運動","胰島素注射","飲食調節"],"answer":"D","explanation":{"correct":"四種組合全部有「飲食調節」。","wrong":{"A":"第一、三種組合冇。","B":"教材治療組合冇列。","C":"第一、二種組合冇。"}}},{"id":"Q217","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"邊個情況下教材指出需要胰島素注射？","options":["血糖初次升高，或體重有輕微下降的情況","病人剛確診，或願意配合控制飲食及運動","口服藥物和飲食無法控制，或需接受外科手術","口服藥有輕微噁心，或病人害怕接受手術"],"answer":"C","explanation":{"correct":"教材：「用於口服藥物和飲食無法有效地控制病情；有嚴重疾病或需接受外科手術」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「口服藥物和飲食無法控制，或需接受外科手術」。","B":"教材冇呢個講法；教材嘅答案係「口服藥物和飲食無法控制，或需接受外科手術」。","D":"教材話副作用嚴重應回診。"}}},{"id":"Q218","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p53（PDF p36）","question":"一型糖尿病嘅特點係？","options":["一般發病少於三十歲、體型偏瘦、屬自體免疫疾病","一般發病少於三十歲、體形肥胖、胰島素抗性","多半四十歲後發病、體形肥胖、胰島素抗性","多半四十歲後發病、體型偏瘦、屬自體免疫疾病"],"answer":"A","explanation":{"correct":"教材：「一般發病時年齡少於三十歲，體型偏瘦」「是一種自體免疫疾病」。","wrong":{"B":"體形同機制屬二型。","C":"係二型特點。","D":"年齡屬二型。"}}},{"id":"Q219","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"以下邊項「唔係」教材所列糖尿病病徵？","options":["傷口難於癒合","體重上升","多尿","口渴"],"answer":"B","explanation":{"correct":"病徵列「口渴」「多尿」「體重下降」「傷口難於癒合」；教材話體重下降，唔係上升。","wrong":{"A":"係病徵。","C":"係病徵。","D":"係病徵。"}}},{"id":"Q220","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"糖尿病神經系統病變最先出現喺邊度？","options":["中樞神經，如記憶衰退","自主神經，如心跳加快","腦神經，如視力模糊","末梢神經，如腳趾發麻"],"answer":"D","explanation":{"correct":"教材：「最先出現末梢神經病變，如腳趾發麻」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「末梢神經，如腳趾發麻」。","B":"教材冇呢個講法；教材嘅答案係「末梢神經，如腳趾發麻」。","C":"視力模糊喺視網膜病變。"}}},{"id":"Q221","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p53（PDF p36）","question":"胰島素抗性係指？","options":["腎臟排走過多胰島素，令血糖無法被利用","胰臟有少量胰島素，但身體組織未能良好反應","胰臟未能製造胰島素，身體依賴注射補充","身體產生抗體破壞胰臟細胞，令激素消失"],"answer":"B","explanation":{"correct":"教材：「胰臟通常會產生一些（少量）胰島素，但身體組織卻不能對胰島素的作用產生良好反應」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「胰臟有少量胰島素，但身體組織未能良好反應」。","C":"教材冇用呢個定義。","D":"教材話一型屬自體免疫，但冇用呢個定義。"}}},{"id":"Q222","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"教材對糖尿病可否根治嘅講法係？","options":["早期可根治，後期不能","只可以控制不能根治","大多數可以根治","二型可根治，一型不能"],"answer":"B","explanation":{"correct":"教材：「糖尿病只可以控制不能根治」。","wrong":{"A":"教材冇咁分。","C":"同教材相反。","D":"教材冇咁分。"}}},{"id":"Q223","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"病人皮膚乾燥、嚴重口渴、呼吸深而快有水果甜味，最符合？","options":["高血糖昏睡／醋酮昏迷","低血糖昏迷","慢性阻塞性肺病","肺結核"],"answer":"A","explanation":{"correct":"高血糖徵狀：「嚴重口渴、多尿」「深而快，而且有水果甜味」。","wrong":{"B":"低血糖係皮膚濕冷。","C":"教材徵狀係長期咳嗽、多痰。","D":"教材徵狀係持續咳嗽、午後潮熱。"}}},{"id":"Q224","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"口服降血糖藥嘅作用「唔包括」以下邊項？","options":["直接補充體內不足的胰島素","抑制腸胃對糖份的吸收","刺激胰臟細胞分泌胰島素","促進組織對糖份的利用"],"answer":"A","explanation":{"correct":"補充胰島素屬胰島素注射：「補充體內不足的胰島素類別」。","wrong":{"B":"係口服藥作用。","C":"係口服藥作用。","D":"係口服藥作用。"}}},{"id":"Q225","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p56（PDF p39）","question":"糖尿病病人剪腳甲，以下邊項正確？","options":["洗腳抹乾後剪，平剪或銼成直線","洗腳前剪，將角位銼圓","洗腳抹乾後剪，將角位銼圓","洗腳前剪，平剪或銼成直線"],"answer":"A","explanation":{"correct":"教材：「洗完腳和抹乾後才可剪腳甲」「腳甲應平剪或銼成直線，不要把角位銼圓」。","wrong":{"B":"時間同形狀都錯。","C":"唔好銼圓角位。","D":"時間錯。"}}},{"id":"Q226","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"高血糖昏睡時脈搏嘅描述係？","options":["緩慢而強","正常或轉淺","不規則而強","加速及微弱"],"answer":"B","explanation":{"correct":"教材：「正常或轉淺」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「正常或轉淺」。","C":"教材冇呢個講法；教材嘅答案係「正常或轉淺」。","D":"係低血糖。"}}},{"id":"Q227","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"胰島素短效、中效、長效分別持續幾耐？","options":["4、8、24 小時","8、24、36 小時","6、12、24 小時","8、16、24 小時"],"answer":"B","explanation":{"correct":"教材：「短效持續 8 小時」「中效持續 24 小時」「長效持續 36 小時」。","wrong":{"A":"同教材唔符；教材寫嘅係「8、24、36 小時」。","C":"同教材唔符；教材寫嘅係「8、24、36 小時」。","D":"同教材唔符；教材寫嘅係「8、24、36 小時」。"}}},{"id":"Q228","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p55（PDF p38）","question":"初服口服降血糖藥有嘔吐及腹瀉，副作用嚴重時教材建議？","options":["多飲清水繼續","自行減藥","立即停藥","及早回診"],"answer":"D","explanation":{"correct":"教材：「若副作用嚴重應及早回診」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「及早回診」。","B":"教材勸喻勿自行增減藥物。","C":"教材冇呢個講法；教材嘅答案係「及早回診」。"}}},{"id":"Q229","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p57（PDF p40）","question":"運動對糖尿病病人有咩好處？","options":["減少碳水化合物利用，提升血糖濃度","抑制新陳代謝，增加身體對胰島素的需要量","促進新陳代謝，減少身體對胰島素的需要量","促進新陳代謝，增加身體對胰島素的需要量"],"answer":"C","explanation":{"correct":"教材：「運動可以促進新陳代謝，加強碳水化合物的利用，因而減少身體對胰島素的需要量」。","wrong":{"A":"方向相反。","B":"方向相反。","D":"需要量係減少。"}}},{"id":"Q230","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"病人皮膚濕冷蒼白、飢餓、顫抖，最符合？","options":["腦血管意外","低血糖昏迷","高血糖昏睡","心肌梗塞"],"answer":"B","explanation":{"correct":"低血糖徵狀：「皮膚、濕冷及蒼白」「飢餓」「顫抖」。","wrong":{"A":"中風徵狀係半身不遂、嘴歪等。","C":"高血糖係皮膚乾燥、嚴重口渴。","D":"心肌梗塞教材冇列飢餓、顫抖。"}}},{"id":"Q231","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p56（PDF p39）","question":"使用胰島素嘅病人運動量增加時，應該？","options":["增加額外食物","減少一餐飲食","暫停注射胰島素","增加胰島素劑量"],"answer":"A","explanation":{"correct":"教材：「使用胰島素劑的病人，若運動量增加時，應增加額外食物」。","wrong":{"B":"同教材相反。","C":"教材冇呢個講法；教材嘅答案係「增加額外食物」。","D":"教材話藥物由醫生調節。"}}},{"id":"Q232","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p56（PDF p39）","question":"糖尿病病人促進足部血液循環，以下邊項符合教材？","options":["冬天赤腳走路以刺激足部血液循環","穿緊身長褲以促進下肢血液回流","長時間用溫水浸腳以促進血液循環","休息時將雙腳抬起，避免兩腳交叉"],"answer":"D","explanation":{"correct":"教材：「休息時可將雙腳抬起」「坐時，避免兩腳交叉」。","wrong":{"A":"教材話注意溫暖、不應赤腳。","B":"教材話避免過緊長褲。","C":"教材話溫水且時間不可過長。"}}},{"id":"Q233","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"糖尿病腎臟病變嘅原因係？","options":["腎上腺腫瘤，激素分泌過多損害腎臟","輸尿管收窄，尿液積聚令腎臟受壓","膀胱感染，細菌上行影響腎臟功能","腎小球血管硬化，過濾功能逐漸衰退"],"answer":"D","explanation":{"correct":"教材：「因腎小球血管硬化，使過濾功能逐漸衰退，導致腎衰竭」。","wrong":{"A":"屬繼發性高血壓成因。","B":"教材冇呢個講法；教材嘅答案係「腎小球血管硬化，過濾功能逐漸衰退」。","C":"教材冇呢個講法；教材嘅答案係「腎小球血管硬化，過濾功能逐漸衰退」。"}}},{"id":"Q234","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p54（PDF p37）","question":"低血糖同高血糖昏迷嘅血糖數值分別可以係？","options":["低於 2.2mmol/L、高於 22mmol/L","低於 4.0mmol/L、高於 40mmol/L","低於 4.0mmol/L、高於 22mmol/L","低於 2.2mmol/L、高於 40mmol/L"],"answer":"D","explanation":{"correct":"教材：「血糖、可低於 2.2mmol」「可高於 40mmol」。","wrong":{"A":"高血糖數值錯。","B":"低血糖數值錯。","C":"兩個數值都唔符合印刷內容。"}}},{"id":"Q235","chapter":"第二章 人體結構及病理｜糖尿病","page":"印刷 p53（PDF p36）","question":"以下邊項最符合教材對糖尿病成因嘅描述？","options":["胰臟不能適當分泌胰島素，或胰島素接收器功能不佳","腎上腺不能因應血糖濃度分泌激素，或甲狀腺亢進","腎臟不能因應血糖濃度過濾糖份，或尿液排糖過多","肝臟不能因應血糖濃度儲存糖份，或胃部吸收過快"],"answer":"A","explanation":{"correct":"教材：「因胰臟不能因應血糖的濃度而適當地分泌胰島素」「或因胰島素接收器功能不佳」。","wrong":{"B":"繼發性高血壓成因先提及呢類。","C":"教材冇呢個講法；教材嘅答案係「胰臟不能適當分泌胰島素，或胰島素接收器功能不佳」。","D":"教材冇呢個講法；教材嘅答案係「胰臟不能適當分泌胰島素，或胰島素接收器功能不佳」。"}}},{"id":"Q236","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p60（PDF p43）","question":"全監督短期治療時間通常係？","options":["六個月，有些可長達九個月甚至一年","三個月，有些可長達六個月甚至九個月","一年，有些可長達兩年甚至三年","兩星期，有些可長達一個月甚至兩個月"],"answer":"A","explanation":{"correct":"教材：「治療時間通常需要六個月」「有些可長達九個月，甚至一年」。","wrong":{"B":"同教材唔符；教材寫嘅係「六個月，有些可長達九個月甚至一年」。","C":"同教材唔符；教材寫嘅係「六個月，有些可長達九個月甚至一年」。","D":"兩星期係傳染性下降時間。"}}},{"id":"Q237","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p60（PDF p43）","question":"抗結核藥物嘅使用方法係？","options":["三種或四種分開時間，每日三次分開服用","一種藥物單獨使用，每日三次於飯後服用","三種或四種一起使用，每日一次或每星期三次","兩種藥物交替使用，隔日一次於睡前服用"],"answer":"C","explanation":{"correct":"教材：「需要三種或四種一起使用」「每日一次或每星期三次服用，並應一次過服用」。","wrong":{"A":"教材話應一次過服用。","B":"教材冇呢個講法；教材嘅答案係「三種或四種一起使用，每日一次或每星期三次」。","D":"教材冇呢個講法；教材嘅答案係「三種或四種一起使用，每日一次或每星期三次」。"}}},{"id":"Q238","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p61（PDF p44）","question":"服抗結核藥後出現皮膚痕癢及出疹，應該？","options":["及早通知醫護人員","停藥一週再觀察","屬正常反應毋須理會","自行塗止痕藥膏"],"answer":"A","explanation":{"correct":"教材：「但如有以下反應，應及早通知醫護人員」，包括皮膚痕癢、出疹。","wrong":{"B":"教材話不依從嘱咐服藥有後果。","C":"教材要通知醫護人員。","D":"教材冇呢個講法；教材嘅答案係「及早通知醫護人員」。"}}},{"id":"Q239","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p62（PDF p45）","question":"香港胸肺科診療所嘅數目，教材話係？","options":["七所全日開放，十一所部分時間開放","五所全日開放，七所部分時間開放","十一所全日開放，七所部分時間開放","十三所全日開放，五所部分時間開放"],"answer":"C","explanation":{"correct":"教材：「十一所全日開放的胸肺科診療所及七所部分時間開放的診所」。","wrong":{"A":"倒轉。","B":"五所係肺科醫院。","D":"十三係私營醫院數目。"}}},{"id":"Q240","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p60（PDF p43）","question":"經抗結核藥物治療，幾多病者可完全康復？","options":["75%以上","90%以下","60%以上","95%以上"],"answer":"D","explanation":{"correct":"教材：「95%以上病者均可完全康復」。","wrong":{"A":"同教材唔符；教材寫嘅係「95%以上」。","B":"同教材唔符；教材寫嘅係「95%以上」。","C":"同教材唔符；教材寫嘅係「95%以上」。"}}},{"id":"Q241","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p58（PDF p41）","question":"教材所列抵抗力弱危險群係？","options":["肥胖人士、營養過剩的人士、孕婦","小學生、長期吸煙的人士、上班族","孕婦、長期運動的人士、青少年","初生嬰兒、營養不良的人士、老年人"],"answer":"D","explanation":{"correct":"教材：「初生嬰兒、營養不良的人士、老年人」。","wrong":{"A":"教材危險群冇咁列。","B":"教材冇呢個講法；教材嘅答案係「初生嬰兒、營養不良的人士、老年人」。","C":"教材冇呢個講法；教材嘅答案係「初生嬰兒、營養不良的人士、老年人」。"}}},{"id":"Q242","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p62（PDF p45）","question":"全監督治療嘅做法係？","options":["定時到診療所取藥，立即在專科護士面前服用","由醫生每日上門監督病人並為病人注射","由家屬每日監督病人在家中定時服藥","定時到診療所取藥，帶回家後自行按時服用"],"answer":"A","explanation":{"correct":"教材：「病人需定時到診療所取藥，並立即在專科護士面前服用」。","wrong":{"B":"教材冇呢個講法；教材嘅答案係「定時到診療所取藥，立即在專科護士面前服用」。","C":"教材冇呢個講法；教材嘅答案係「定時到診療所取藥，立即在專科護士面前服用」。","D":"要喺護士面前服用。"}}},{"id":"Q243","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p62（PDF p45）","question":"卡介苗（BCG）教材話係為邊啲人接種？","options":["老年人和孕婦","初生嬰兒和小學生","肺結核病人家屬","免疫力缺乏症患者"],"answer":"B","explanation":{"correct":"教材：「以及為初生嬰兒和小學生接種卡介苗」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「初生嬰兒和小學生」。","C":"家屬係做檢查。","D":"教材冇呢個講法；教材嘅答案係「初生嬰兒和小學生」。"}}},{"id":"Q244","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p59（PDF p42）","question":"以下邊組係肺結核徵狀？","options":["間歇咳嗽、夜間潮熱、消瘦、多尿、耳鳴","乾咳、午後發冷、水腫、尿頻、盜汗","持續咳嗽、晨早發燒、肥胖、胸痛、口渴","持續咳嗽、午後潮熱、消瘦、咳血、盜汗"],"answer":"D","explanation":{"correct":"教材：「持續咳嗽、午後潮熱、消瘦、咳血、盜汗」。","wrong":{"A":"多尿、耳鳴唔喺清單。","B":"水腫、尿頻唔喺清單。","C":"晨早發燒、肥胖、口渴唔喺清單。"}}},{"id":"Q245","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p58（PDF p41）","question":"以下邊項「唔係」教材所列減弱抵抗力嘅疾病？","options":["糖尿","高血壓","癌症","矽肺"],"answer":"B","explanation":{"correct":"列有「免疫力缺乏症、愛滋病感染、癌症、糖尿、矽肺、酗酒」，冇高血壓。","wrong":{"A":"有列。","C":"有列。","D":"有列。"}}},{"id":"Q246","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p60（PDF p43）","question":"通常服藥幾耐後傳染性減至微乎其微？","options":["兩三天","一個月","六個月","兩週"],"answer":"D","explanation":{"correct":"教材：「通常於服藥兩週後，傳染性減至微乎其微」。","wrong":{"A":"兩三天係病菌減少 90%。","B":"教材冇呢個講法；教材嘅答案係「兩週」。","C":"六個月係治療時間。"}}},{"id":"Q247","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p60（PDF p43）","question":"服抗結核藥後兩三天，病菌數目點變？","options":["冇明顯變化","立即減少 50%","立即減少 99.9%","立即減少 90%"],"answer":"D","explanation":{"correct":"教材：「當服用抗結核藥物後兩三天，病菌的數目就立即減少 90」。","wrong":{"A":"同教材相反。","B":"同教材唔符；教材寫嘅係「立即減少 90%」。","C":"99.9% 係約第 14 日圖示。"}}},{"id":"Q248","chapter":"第二章 人體結構及病理｜肺結核","page":"印刷 p62（PDF p45）","question":"以下邊間「唔係」教材所列五所肺科醫院？","options":["香港眼科醫院","律敦治醫院","黃大仙醫院","葛量洪醫院"],"answer":"A","explanation":{"correct":"五所：「葛量洪醫院、律敦治醫院、靈實醫院、九龍醫院及黃大仙醫院」。香港眼科醫院喺 p5 係專科醫院例子。","wrong":{"B":"有列。","C":"有列。","D":"有列。"}}},{"id":"Q249","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"慢性阻塞性肺病病人出現缺氧時，教材所述嘅表現係？","options":["午後潮熱及夜間盜汗","嘴唇、手、腳呈藍色","呼吸深快有水果甜味","皮膚濕冷及面色蒼白"],"answer":"B","explanation":{"correct":"教材：「出現缺氧情況，如嘴唇、手、腳呈藍色」。","wrong":{"A":"屬肺結核。","C":"屬高血糖。","D":"屬低血糖。"}}},{"id":"Q250","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"2007 年慢性阻塞性肺病病人住院日數，佔全年病床使用日數第幾位？","options":["第五","第一","第二","第三"],"answer":"D","explanation":{"correct":"教材：「佔全年總病床使用日數的第三位」。","wrong":{"A":"第五係殺手病排位。","B":"同教材唔符；教材寫嘅係「第三」。","C":"同教材唔符；教材寫嘅係「第三」。"}}},{"id":"Q251","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"以下邊項係導致慢性阻塞性肺病嘅高危因素？","options":["甲狀腺機能亢進","胰島素接收器功能不佳","結核桿菌感染","先天性抗蛋白質酵素不足"],"answer":"D","explanation":{"correct":"教材：「先天性抗蛋白質酵素不足，與遺傳有關」。","wrong":{"A":"屬繼發性高血壓。","B":"屬糖尿病。","C":"屬肺結核。"}}},{"id":"Q252","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"教材話慢性阻塞性肺病係點樣嘅疾病？","options":["服藥數月後可以康復","無法治癒且病情會不斷惡化","屬急性傳染病","可以根治且病情會逐步好轉"],"answer":"B","explanation":{"correct":"教材：「是一種無法治癒且病情會不斷惡化的慢性疾病」。","wrong":{"A":"同教材相反。","C":"教材話係慢性疾病。","D":"同教材相反。"}}},{"id":"Q253","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"根據 2007 年統計，慢性阻塞性肺病係香港第幾大殺手？","options":["第三","第五","第一","第七"],"answer":"B","explanation":{"correct":"教材：「根據 2007 年的統計數字，是香港第五大殺手病」。","wrong":{"A":"第三係佔病床使用日數嘅排位。","C":"同教材唔符；教材寫嘅係「第五」。","D":"同教材唔符；教材寫嘅係「第五」。"}}},{"id":"Q254","chapter":"第二章 人體結構及病理｜慢性阻塞性肺病","page":"印刷 p63（PDF p46）","question":"教材對慢性阻塞性肺病點樣預防嘅講法係？","options":["不吸煙或戒煙有助預防","接種卡介苗有助預防","控制血糖有助預防","飲食調節有助預防"],"answer":"A","explanation":{"correct":"教材：「不吸煙或戒煙有助預防」。","wrong":{"B":"卡介苗屬結核病。","C":"屬糖尿病。","D":"教材呢段冇咁講。"}}},{"id":"Q255","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p82（PDF p49）","question":"接近過期嘅物品應點擺放？","options":["放置於後方","放置於前方","放置於通道旁","放置於高層"],"answer":"B","explanation":{"correct":"教材：「將「接近過期」的物品放置於前方」。","wrong":{"A":"同教材相反。","C":"教材話切勿阻礙通道。","D":"教材冇呢個講法；教材嘅答案係「放置於前方」。"}}},{"id":"Q256","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p81（PDF p48）","question":"掛牆式真空吸引器曾被使用，轉床清潔時要？","options":["抹淨外殼，保留原有喉管","交 C.S.S.D. 消毒","用清水沖洗喉管重用","更換新的喉管和真空袋"],"answer":"D","explanation":{"correct":"教材：「更換新的喉管和真空袋」。","wrong":{"A":"教材要更換。","B":"教材冇呢個講法；教材嘅答案係「更換新的喉管和真空袋」。","C":"教材要更換。"}}},{"id":"Q257","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"點算不銹鋼儀器時要特別留意乜？","options":["儀器有否生鏽及關節鬆脫","儀器表面有否被刮花或變形","小件儀器藏於症巾而被丟掉","儀器有否貼上過期標籤"],"answer":"C","explanation":{"correct":"教材：「留意小件儀器藏於症巾而被丟掉」。","wrong":{"A":"教材冇呢個講法；教材嘅答案係「小件儀器藏於症巾而被丟掉」。","B":"教材冇呢個講法；教材嘅答案係「小件儀器藏於症巾而被丟掉」。","D":"教材呢步冇咁講。"}}},{"id":"Q258","chapter":"第三章 環境衞生及安全｜物品存放","page":"印刷 p80（PDF p47）","question":"利器除去後應放喺邊度？","options":["C.S.S.D. 大桶","已用儀器箱","利器收集箱","污物處理桶"],"answer":"C","explanation":{"correct":"教材：
